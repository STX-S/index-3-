ية تبدأ بفرضية خاطئة تكون النتيجة فوراً <span class=\"m\">⇒<\/span> <strong>True<\/strong>.<\/li>\n<li><strong>20d)<\/strong> <code>If 1 + 1 = 2, then dogs can fly.<\/code><br />\n<em>التحليل:<\/em> الفرضية <span class=\"m\">1 + 1 = 2<\/span> هي <span class=\"m\">T<\/span>. النتيجة &quot;dogs can fly&quot; هي <span class=\"m\">F<\/span>. فرضية صحيحة أدت لنتيجة خاطئة <span class=\"m\">⇒<\/span> <strong>False<\/strong>.<\/li>\n<\/ul>\n<h3>تمارين 29-30 (ص 16): أوجد Converse, Contrapositive, Inverse:<\/h3>\n<ul>\n<li><p><strong>29a)<\/strong> <code>If it snows today, I will ski tomorrow.<\/code><br />\n<em>الفرضية <span class=\"m\">p<\/span>:<\/em> It snows today.<br />\n<em>النتيجة <span class=\"m\">q<\/span>:<\/em> I will ski tomorrow.<\/p>\n<ul>\n<li><strong>Converse (<span class=\"m\">q → p<\/span>):<\/strong> &quot;If I ski tomorrow, then it snows today.&quot;<\/li>\n<li><strong>Inverse (<span class=\"m\">¬ p → ¬ q<\/span>):<\/strong> &quot;If it does not snow today, then I will not ski tomorrow.&quot;<\/li>\n<li><strong>Contrapositive (<span class=\"m\">¬ q → ¬ p<\/span>):<\/strong> &quot;If I do not ski tomorrow, then it does not snow today.&quot;<\/li>\n<\/ul>\n<\/li>\n<li><p><strong>30b)<\/strong> <code>I go to the beach whenever it is a sunny summer day.<\/code><br />\n<em>التحليل:<\/em> الكلمة المفتاحية <code>whenever<\/code> تعني أن ما بعدها هو الفرضية <span class=\"m\">p<\/span>.<br />\n<em>الفرضية <span class=\"m\">p<\/span>:<\/em> It is a sunny summer day.<br />\n<em>النتيجة <span class=\"m\">q<\/span>:<\/em> I go to the beach.<br />\n<em>العبارة الأصلية:<\/em> <span class=\"m\">p → q<\/span>.<\/p>\n<ul>\n<li><strong>Converse (<span class=\"m\">q → p<\/span>):<\/strong> &quot;If I go to the beach, then it is a sunny summer day.&quot;<\/li>\n<li><strong>Inverse (<span class=\"m\">¬ p → ¬ q<\/span>):<\/strong> &quot;If it is not a sunny summer day, then I do not go to the beach.&quot;<\/li>\n<li><strong>Contrapositive (<span class=\"m\">¬ q → ¬ p<\/span>):<\/strong> &quot;If I do not go to the beach, then it is not a sunny summer day.&quot;<\/li>\n<\/ul>\n<\/li>\n<li><p><strong>30c)<\/strong> <code>When I stay up late, it is necessary that I sleep until noon.<\/code><br />\n<em>التحليل:<\/em> ما يتبع <code>When<\/code> هو الفرضية <span class=\"m\">p<\/span>. وما وُصف بأنه <code>necessary<\/code> هو النتيجة <span class=\"m\">q<\/span>.<br />\n<em>الفرضية <span class=\"m\">p<\/span>:<\/em> I stay up late.<br />\n<em>النتيجة <span class=\"m\">q<\/span>:<\/em> I sleep until noon.<\/p>\n<ul>\n<li><strong>Converse (<span class=\"m\">q → p<\/span>):<\/strong> &quot;If I sleep until noon, then I stay up late.&quot;<\/li>\n<li><strong>Inverse (<span class=\"m\">¬ p → ¬ q<\/span>):<\/strong> &quot;If I do not stay up late, then I do not sleep until noon.&quot;<\/li>\n<li><strong>Contrapositive (<span class=\"m\">¬ q → ¬ p<\/span>):<\/strong> &quot;If I do not sleep until noon, then I do not stay up late.&quot;<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>تمارين 31-32 (ص 16): كم عدد الصفوف في جدول الصواب؟<\/h3>\n<ul>\n<li><strong>31a) <span class=\"m\">p → ¬ p<\/span>:<\/strong><br />\n<em>المتغيرات الفريدة:<\/em> فقط <span class=\"m\">p<\/span> (<span class=\"m\">n = 1<\/span>).<br />\n<span class=\"m\">⇒ Rows = 2<sup>1<\/sup> = 2<\/span>.<\/li>\n<li><strong>32c) <span class=\"m\">(p → r) ∨ (¬ s → ¬ t) ∨ (¬ u → v)<\/span>:<\/strong><br />\n<em>المتغيرات الفريدة:<\/em> <span class=\"m\">p, r, s, t, u, v<\/span> (<span class=\"m\">n = 6<\/span>).<br />\n<span class=\"m\">⇒ Rows = 2<sup>6<\/sup> = 64<\/span>.<\/li>\n<\/ul>\n<h3>تمارين 33-38 (ص 16): بناء جداول الصواب<\/h3>\n<ul>\n<li><strong>34c) <span class=\"m\">p ⊕ (p ∨ q)<\/span>:<\/strong><\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ∨ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ⊕ (p ∨ q)<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>36c) <span class=\"m\">p ⊕ ¬ p<\/span>:<\/strong><\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ⊕ ¬ p<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>(نلاحظ أن <span class=\"m\">p ⊕ ¬ p<\/span> تمثل Tautology).<\/em><\/p>\n<ul>\n<li><strong>38e) <span class=\"m\">(p ∨ q) ∧ ¬ r<\/span>:<\/strong><\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">r<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ r<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ∨ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">(p ∨ q) ∧ ¬ r<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>تمرين 6 (ص 38): التحقق من قانون دي مورغان الأول باستخدام جدول الصواب<\/h3>\n<p><strong>المطلوب إثبات:<\/strong> <span class=\"m\">¬(p ∧ q) ≡ ¬ p ∨ ¬ q<\/span><\/p>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ∧ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬(p ∧ q)<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p ∨ ¬ q<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>العمود الرابع يطابق العمود السابع في كافة الصفوف <span class=\"m\">⇒ ¬(p ∧ q) ≡ ¬ p ∨ ¬ q<\/span>.<\/p>\n<h3>تمرين 8 (ص 38): نفي الجمل باستخدام قوانين دي مورغان<\/h3>\n<ul>\n<li><strong>b)<\/strong> <code>Yoshiko knows Java and calculus.<\/code><br />\n<em>الفرضيات:<\/em> <span class=\"m\">p<\/span>: Yoshiko knows Java, <span class=\"m\">q<\/span>: Yoshiko knows calculus.<br />\n<em>العبارة الأصلية:<\/em> <span class=\"m\">p ∧ q<\/span>.<br />\n<em>النفي باستخدام دي مورغان:<\/em> <span class=\"m\">¬(p ∧ q) ≡ ¬ p ∨ ¬ q<\/span>.<br />\n<span class=\"m\">⇒<\/span> &quot;Yoshiko does not know Java or she does not know calculus.&quot;<\/li>\n<li><strong>d)<\/strong> <code>Rita will move to Oregon or Washington.<\/code><br />\n<em>العبارة الأصلية:<\/em> <span class=\"m\">p ∨ q<\/span>.<br />\n<em>النفي باستخدام دي مورغان:<\/em> <span class=\"m\">¬(p ∨ q) ≡ ¬ p ∧ ¬ q<\/span>.<br />\n<span class=\"m\">⇒<\/span> &quot;Rita will not move to Oregon and she will not move to Washington.&quot;<\/li>\n<\/ul>\n<h3>تمرين 13 (ص 38): إثبات التوتولوجي جبرياً بدون جدول صواب<\/h3>\n<ul>\n<li><p><strong>13b) أثبت أن <span class=\"m\">p → (p ∨ q)<\/span> هي Tautology:<\/strong>\n<table class=\"proof\"><tr><td class=\"m\">p → (p ∨ q) ≡ ¬ p ∨ (p ∨ q)<\/td><td class=\"why\">by Conditional Law (A → B ≡ ¬ A ∨ B)<\/td><\/tr><tr><td class=\"m\">≡ (¬ p ∨ p) ∨ q<\/td><td class=\"why\">by Associative Law<\/td><\/tr><tr><td class=\"m\">≡ T ∨ q<\/td><td class=\"why\">by Negation Law (¬ p ∨ p ≡ T)<\/td><\/tr><tr><td class=\"m\">≡ T<\/td><td class=\"why\">by Domination Law (T ∨ q ≡ T)<\/td><\/tr><\/table><\/div>\n<span class=\"m\">⇒<\/span> العبارة Tautology.<\/p>\n<\/li>\n<li><p><strong>13f) أثبت أن <span class=\"m\">¬(p → q) → ¬ q<\/span> هي Tautology:<\/strong>\n<table class=\"proof\"><tr><td class=\"m\">¬(p → q) → ¬ q ≡ ¬[¬(p → q)] ∨ ¬ q<\/td><td class=\"why\">by Conditional Law<\/td><\/tr><tr><td class=\"m\">≡ (p → q) ∨ ¬ q<\/td><td class=\"why\">by Double Negation<\/td><\/tr><tr><td class=\"m\">≡ (¬ p ∨ q) ∨ ¬ q<\/td><td class=\"why\">by Conditional Law<\/td><\/tr><tr><td class=\"m\">≡ ¬ p ∨ (q ∨ ¬ q)<\/td><td class=\"why\">by Associative Law<\/td><\/tr><tr><td class=\"m\">≡ ¬ p ∨ T<\/td><td class=\"why\">by Negation Law (q ∨ ¬ q ≡ T)<\/td><\/tr><tr><td class=\"m\">≡ T<\/td><td class=\"why\">by Domination Law<\/td><\/tr><\/table><\/div>\n<span class=\"m\">⇒<\/span> العبارة Tautology.<\/p>\n<\/li>\n<\/ul>\n<h3>تمرين 26 (ص 38): إثبات التكافؤ <span class=\"m\">(p → q) ∧ (p → r) ≡ p → (q ∧ r)<\/span> جبرياً:<\/h3>\n<p>نبدأ من الطرف الأيسر:\n<table class=\"proof\"><tr><td class=\"m\">(p → q) ∧ (p → r) ≡ (¬ p ∨ q) ∧ (¬ p ∨ r)<\/td><td class=\"why\">by Conditional Law<\/td><\/tr><tr><td class=\"m\">≡ ¬ p ∨ (q ∧ r)<\/td><td class=\"why\">by Distributive Law (taking ¬ p ∨ as common)<\/td><\/tr><tr><td class=\"m\">≡ p → (q ∧ r)<\/td><td class=\"why\">by Conditional Law (¬ A ∨ B ≡ A → B)<\/td><\/tr><\/table><\/div>\nوهو المطلوب إثباته.<\/p>\n<h3>تمرين 32 (ص 38): إثبات تكافؤ <span class=\"m\">p ↔ q ≡ ¬ p ↔ ¬ q<\/span> جبرياً:<\/h3>\n<p><table class=\"proof\"><tr><td class=\"m\">¬ p ↔ ¬ q ≡ (¬ p → ¬ q) ∧ (¬ q → ¬ p)<\/td><td class=\"why\">by Definition of Biconditional<\/td><\/tr><tr><td class=\"m\">≡ (q → p) ∧ (p → q)<\/td><td class=\"why\">by Contrapositive Law applied to each conditional<\/td><\/tr><tr><td class=\"m\">≡ (p → q) ∧ (q → p)<\/td><td class=\"why\">by Commutative Law<\/td><\/tr><tr><td class=\"m\">≡ p ↔ q<\/td><td class=\"why\">by Definition of Biconditional<\/td><\/tr><\/table><\/div>\nوهو المطلوب إثباته.<\/p>\n<h3>تمرين 66 (ص 40): اختبار الـ Satisfiability<\/h3>\n<p>حدد هل العبارة التالية Satisfiable أم لا:\n<div class=\"m dm\">(p ∨ q ∨ ¬ r) ∧ (p ∨ ¬ q ∨ ¬ s) ∧ (p ∨ ¬ r ∨ ¬ s) ∧ (¬ p ∨ ¬ q ∨ ¬ s) ∧ (p ∨ q ∨ ¬ s)<\/div><\/p>\n<ul>\n<li><strong>استراتيجية الحل السريعة والمضمونة:<\/strong>\nنبحث عن تعيين لقيم المتغيرات يجعل كل الأقواس الخمسة تعطي <span class=\"m\">T<\/span>:<ul>\n<li>لاحظ أن المتغير <span class=\"m\">p<\/span> موجود كطرف موجب في 4 أقواس من أصل 5!<\/li>\n<li>لنجعل <span class=\"m\">p = T<\/span>:<ul>\n<li>القوس الأول: <span class=\"m\">(T ∨ …) = T<\/span>.<\/li>\n<li>القوس الثاني: <span class=\"m\">(T ∨ …) = T<\/span>.<\/li>\n<li>القوس الثالث: <span class=\"m\">(T ∨ …) = T<\/span>.<\/li>\n<li>القوس الخامس: <span class=\"m\">(T ∨ …) = T<\/span>.<\/li>\n<\/ul>\n<\/li>\n<li>يتبقى لدينا فقط القوس الرابع: <span class=\"m\">(¬ p ∨ ¬ q ∨ ¬ s)<\/span>. بما أن <span class=\"m\">p = T<\/span>، فإن <span class=\"m\">¬ p = F<\/span>.<br />\nلكي يصبح القوس الرابع <span class=\"m\">T<\/span>، يكفي أن نختار إما <span class=\"m\">q = F<\/span> (فيصبح <span class=\"m\">¬ q = T<\/span>) أو <span class=\"m\">s = F<\/span> (فيصبح <span class=\"m\">¬ s = T<\/span>).<\/li>\n<li>لنختر: <span class=\"m\">p = T, q = F, r = T, s = F<\/span>.<\/li>\n<li>القوس الرابع يصبح: <span class=\"m\">(F ∨ T ∨ T) = T<\/span>.<\/li>\n<li>وجميع الأقواس الأخرى تظل <span class=\"m\">T<\/span>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>النتيجة:<\/strong> العبارة <strong>Satisfiable<\/strong>، وأحد حلولها هو:\n<div class=\"m dm\">p = T, q = F, r = T, s = F<\/div><\/li>\n<\/ul>\n"}, {"s": "Exam traps", "t": "جدول الفخاخ الامتحانية الذهبية للوحدة الأولى (Exam Traps Summary)", "h": "<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:left\">المفهوم (Topic)<\/th>\n  <th style=\"text-align:left\">الفخ الشائع (The Trap)<\/th>\n  <th style=\"text-align:left\">كيف يقع الطالب فيه؟<\/th>\n  <th style=\"text-align:left\">القاعدة الذهبية لكشفه وتجاوزه<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\"><strong>Truth Table Rows<\/strong><\/td>\n  <td style=\"text-align:left\">عدّ إشارات النفي والمتغيرات المكررة.<\/td>\n  <td style=\"text-align:left\">حساب <span class=\"m\">¬ p<\/span> كمتغير جديد في العبارة <span class=\"m\">(p ∧ ¬ p ∧ q)<\/span>.<\/td>\n  <td style=\"text-align:left\">عدد الصفوف هو <span class=\"m\">2<sup>n<\/sup><\/span> حيث <span class=\"m\">n<\/span> هو عدد المتغيرات الأصلية الفريدة فقط (<span class=\"m\">p, q ⇒ 2<sup>2<\/sup>=4<\/span>).<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Conditional Statement<\/strong><\/td>\n  <td style=\"text-align:left\">افتراض أن <span class=\"m\">p → q<\/span> تتطلب علاقة سببية واقعية.<\/td>\n  <td style=\"text-align:left\">الحكم بأن &quot;إذا كانت الغيوم حلوى فأنا غني&quot; خاطئة لأن المعنى غير مترابط.<\/td>\n  <td style=\"text-align:left\">المنطق الصوري يعتمد فقط على قيم <span class=\"m\">T/F<\/span>. إذا كانت الفرضية <span class=\"m\">F<\/span>، فالعبارة الشرطية صائبة <span class=\"m\">T<\/span> فوراً.<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>English Translation<\/strong><\/td>\n  <td style=\"text-align:left\">الخلط بين <code>if<\/code> وبين <code>only if<\/code>.<\/td>\n  <td style=\"text-align:left\">ترجمة <code>p only if q<\/code> كـ <span class=\"m\">q → p<\/span>.<\/td>\n  <td style=\"text-align:left\"><code>p only if q<\/code> تعني <span class=\"m\">p → q<\/span>. ما بعد <code>if<\/code> فرضية، وما بعد <code>only if<\/code> نتيجة دائماً.<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Conditional Derivations<\/strong><\/td>\n  <td style=\"text-align:left\">الاعتقاد بأن العكس (Converse) يكافئ الأصلية.<\/td>\n  <td style=\"text-align:left\">كتابة أن &quot;إذا أمطرت ابتلت الأرض&quot; تكافئ &quot;إذا ابتلت الأرض فقد أمطرت&quot;.<\/td>\n  <td style=\"text-align:left\">العبارة الشرطية لا تكافئ إلا المعاكس الإيجابي (<span class=\"m\">p → q ≡ ¬ q → ¬ p<\/span>). العكس يكافئ المعكوس فقط.<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Negation of Implication<\/strong><\/td>\n  <td style=\"text-align:left\">نفي السهم بتحويله لسهم منفي.<\/td>\n  <td style=\"text-align:left\">كتابة <span class=\"m\">¬(p → q)<\/span> على أنها <span class=\"m\">p → ¬ q<\/span> أو <span class=\"m\">¬ p → ¬ q<\/span>.<\/td>\n  <td style=\"text-align:left\">نفي الشرط يتحول دائماً إلى وصل: <span class=\"m\">¬(p → q) ≡ p ∧ ¬ q<\/span>.<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Equivalence vs Inference<\/strong><\/td>\n  <td style=\"text-align:left\">استخدام قوانين التكافؤ كاستنتاج.<\/td>\n  <td style=\"text-align:left\">مساواة <span class=\"m\">p → q<\/span> بـ <span class=\"m\">q → p<\/span>.<\/td>\n  <td style=\"text-align:left\">التكافؤ <span class=\"m\">≡<\/span> يعني تطابق الأعمدة في جدول الصواب في كل الحالات دون استثناء.<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Satisfiability<\/strong><\/td>\n  <td style=\"text-align:left\">الخلط بين Tautology و Satisfiable.<\/td>\n  <td style=\"text-align:left\">افتراض أن Satisfiable تعني أن كل الصفوف <span class=\"m\">T<\/span>.<\/td>\n  <td style=\"text-align:left\">يكفي صف واحد فقط ناتجه <span class=\"m\">T<\/span> لتكون العبارة Satisfiable. الـ Tautology حالة خاصة منها.<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>Precedence<\/strong><\/td>\n  <td style=\"text-align:left\">إهمال ترتيب الروابط وغياب الأقواس.<\/td>\n  <td style=\"text-align:left\">تطبيق السهم <span class=\"m\">→<\/span> قبل الفصل <span class=\"m\">∨<\/span> في عبارة مثل <span class=\"m\">p ∨ q → r<\/span>.<\/td>\n  <td style=\"text-align:left\">الترتيب ثابت: الأقواس، ثم <span class=\"m\">¬<\/span>، ثم <span class=\"m\">∧<\/span>، ثم <span class=\"m\">∨<\/span>، ثم <span class=\"m\">→<\/span>، وأخيراً <span class=\"m\">↔<\/span>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}];

 else if(kind==='g_cls'){const [f,fn]=pick(CLS),vals=[[1,1],[1,0],[0,1],[0,0]].map(([a,b])=>fn(!!a,!!b)),k=vals.every(x=>x)?'T':vals.every(x=>!x)?'C':'N';

function drillView(){let D=V.dr;if(!D)D=V.dr={o:shuffle(PD.map((_,i)=>i)).slice(0,10),i:0,s:0,p:null};
 if(D.i>=D.o.length)return `<div class="box ${D.s>=8?'aff':'warn'}"><h4>🏁 النتيجة • Result</h4><div style="font-size:28px;font-weight:800">${D.s} / ${D.o.length}</div><button class="btn sm" style="margin-top:8px" data-a="dreset">🔄 جولة جديدة</button></div>`;
 const [t,ok,why]=PD[D.o[D.i]],a=D.p,dis=a!=null?'disabled':'';
 return `<div class="box q"><h4>🎯 تدرّب • ${D.i+1}/${D.o.length}</h4><div style="font-size:20px;font-weight:800;margin:8px 0" dir="auto">${t}</div><div class="row"><button class="btn g" data-a="drill" data-v="1" ${dis}>✅ Proposition</button><button class="btn r" data-a="drill" data-v="0" ${dis}>❌ Not a proposition</button></div>${a!=null?`<div class="fb ${a===ok?'ok':'no'}" style="margin-top:10px"><div class="h">${a===ok?'✅ صح':'❌ غلط'}</div><div class="ar">${ok?'Proposition':'Not a proposition'} — ${why}</div></div><button class="btn sm" style="margin-top:8px" data-a="dnext">التالي ▶</button>`:''}</div>`}
const GH=[
()=>`<div class="rules">${rl('1️⃣ هل هي جملة خبرية (تقرير)؟','أمر (Sit down!) • سؤال (What time is it?) • تعجب ← <b>Not a proposition</b>')}${rl('2️⃣ هل فيها مجهول أو ضمير بلا مرجع؟','x, y, n أو this/he بلا تحديد ← <b>Not</b> (هذه Predicate). تصير Proposition إذا عوّضت قيمة (x = 3) أو ربطتها بـ ∀ / ∃.')}${rl('3️⃣ هل لها قيمة واحدة قاطعة T أو F؟','مفارقة (This statement is false) أو رأي شخصي (best, delicious) ← <b>Not</b>')}${rl('✅ عبرت الثلاثة؟','فهي <b>Proposition</b> — حتى لو كانت كاذبة أو ما تعرف الجواب.')}</div>
<div class="grid g2" style="margin-top:10px"><div class="box aff"><h4>✅ لا يهم</h4><ul class="ar"><li>كونها <b>كاذبة</b> (0 + 0 = 2 تبقى Proposition).</li><li>أنك <b>لا تعرف</b> قيمتها (حياة على كواكب أخرى).</li><li>أنها بلا علاقة بالرياضيات.</li></ul></div><div class="box neg"><h4>⚠ فخاخ</h4><ul class="ar"><li>معادلة فيها رموز لا تعني Proposition: <span class="mono">4 + x = 5</span> ❌</li><li>سؤال جوابه واضح يبقى سؤالاً ❌</li><li>"for some x, x + 1 = 2" تصير Proposition لأن x مربوط.</li></ul></div></div><div style="margin-top:10px">${drillView()}</div>`,
()=>`<div class="tscroll"><table class="t"><tr><th>Connective</th><th>تُقرأ</th><th>تكون T متى؟</th><th>تكون F متى؟</th><th>حيلة الحفظ</th></tr><tr><td class="mono">¬p</td><td>not</td><td>p = F</td><td>p = T</td><td>يعكس</td></tr><tr><td class="mono">p ∧ q</td><td>and</td><td>الاثنان T فقط</td><td>أي واحد F</td><td>كلاهما</td></tr><tr><td class="mono">p ∨ q</td><td>or</td><td>واحد T على الأقل</td><td>الاثنان F فقط</td><td>واحد يكفي</td></tr><tr><td class="mono">p ⊕ q</td><td>xor</td><td>قيمتان مختلفتان</td><td>متشابهتان</td><td>اختلاف</td></tr><tr><td class="mono">p → q</td><td>if…then</td><td>غير ذلك</td><td><b>p = T و q = F</b> فقط</td><td>وعد مكسور</td></tr><tr><td class="mono">p ↔ q</td><td>iff</td><td>متشابهتان</td><td>مختلفتان</td><td>تطابق</td></tr></table></div><div class="box warn" style="margin-top:10px"><h4>⚠ تذكّر</h4><div class="ar">صفوف جدول الصواب = 2ⁿ حيث n عدد المتغيرات <b>الفريدة</b> فقط. الأولوية: ¬ ثم ∧ ثم ∨ ثم → ثم ↔.</div></div>`,
()=>`<div class="tscroll"><table class="t"><tr><th>كلمات في الجملة</th><th>الرمز</th></tr><tr><td>and, but, however, although, yet, while</td><td class="mono">p ∧ q</td></tr><tr><td>or (عادي)</td><td class="mono">p ∨ q</td></tr><tr><td>or … but not both / exclusive</td><td class="mono">p ⊕ q</td></tr><tr><td>not, it is not the case that, never</td><td class="mono">¬p</td></tr><tr><td>neither p nor q</td><td class="mono">¬p ∧ ¬q ≡ ¬(p ∨ q)</td></tr><tr><td>if p then q • p implies q • q when / whenever / if p • p only if q</td><td class="mono">p → q</td></tr><tr><td>p is sufficient for q • q is necessary for p</td><td class="mono">p → q</td></tr><tr><td>p is necessary for q</td><td class="mono">q → p</td></tr><tr><td>p unless q</td><td class="mono">¬q → p ≡ p ∨ q</td></tr><tr><td>p iff q • necessary and sufficient</td><td class="mono">p ↔ q</td></tr></table></div><div class="rules" style="margin-top:10px">${rl('خطوات الترجمة','1) سمِّ الجمل البسيطة p, q, r  2) ضع الروابط  3) راجع الأقواس  4) ارجع للإنجليزي وتأكد.')}${rl('حيلة الشرطية','<b>if / sufficient</b> → الفرضية p • <b>only if / necessary</b> → النتيجة q.')}</div><div class="box warn" style="margin-top:10px"><h4>⚠ either … or</h4><div class="ar">بدون "but not both" قد تُترجم ∨ في بعض المراجع. حل تمرين 16f في سلايدات دكتورك استخدم ⊕، فاتبع حل الدكتور في الاختبار.</div></div>`,
()=>`<div class="rules">${rl('1) حدد p و q','p بعد if / when / whenever / sufficient • q بعد then / only if / necessary.')}${rl('2) اشتق','Converse: <span class="mono">q → p</span> (يبدّل) • Inverse: <span class="mono">¬p → ¬q</span> (ينفي) • Contrapositive: <span class="mono">¬q → ¬p</span> (يبدّل وينفي).')}${rl('3) نظّف النفي المزدوج','¬(¬q) تصير q (مثال السلايدات: p → ¬q ← Converse هو ¬q → p).')}${rl('4) من يكافئ من؟','الأصل ≡ Contrapositive • Converse ≡ Inverse • الأصل <b>لا</b> يكافئ Converse ولا Inverse.')}</div><div class="box q" style="margin-top:10px"><h4>مثال: p = it rains, q = I go out</h4><ul class="ar"><li><b>Converse:</b> If I go out, then it rains.</li><li><b>Inverse:</b> If it does not rain, then I do not go out.</li><li><b>Contrapositive:</b> If I do not go out, then it does not rain.</li></ul></div><div class="box neg"><h4>❌ نفي الشرطية</h4><div class="mono">¬(p → q) ≡ p ∧ ¬q</div></div>`,
()=>`<div class="grid g3"><div class="box aff"><h4>Tautology</h4><div class="ar">كل الصفوف T. مثل <span class="mono">p ∨ ¬p</span></div></div><div class="box neg"><h4>Contradiction</h4><div class="ar">كل الصفوف F. مثل <span class="mono">p ∧ ¬p</span></div></div><div class="box warn"><h4>Contingency</h4><div class="ar">فيها T و F. مثل <span class="mono">p ∨ q</span></div></div></div><div class="rules" style="margin-top:10px">${rl('اختصار سريع','ابحث عن صف يجعلها <b>F</b>: ما وجدت؟ ← Tautology • ابحث عن صف يجعلها <b>T</b>: ما وجدت؟ ← Contradiction.')}${rl('للشرطية A → B','تكون Tautology إذا استحال أن يكون A = T مع B = F.')}${rl('علاقات','نفي الـ Tautology هو Contradiction • كل Tautology هي Satisfiable.')}</div>`,
()=>`<div class="rules">${rl('1) أزل → و ↔','<span class="mono">p → q ≡ ¬p ∨ q</span> • <span class="mono">p ↔ q ≡ (p → q) ∧ (q → p)</span>')}${rl('2) أدخل النفي','De Morgan: <span class="mono">¬(p ∧ q) ≡ ¬p ∨ ¬q</span> • <span class="mono">¬(p ∨ q) ≡ ¬p ∧ ¬q</span> ثم النفي المزدوج.')}${rl('3) وزّع وجمّع','Distributive / Associative / Commutative.')}${rl('4) اصطد الثوابت','<span class="mono">p ∨ ¬p ≡ T</span> • <span class="mono">p ∧ ¬p ≡ F</span> ثم Domination و Identity للإنهاء.')}${rl('قاعدة الاختبار','عند "without truth tables" اكتب اسم القانون بجانب كل خطوة.')}</div><div class="box q" style="margin-top:10px"><h4>Satisfiability (SAT)</h4><ul class="ar"><li><b>Satisfiable:</b> يكفي تعيين واحد يجعلها T (ابدأ بالمتغير الأكثر ظهوراً موجباً).</li><li><b>Unsatisfiable:</b> لازم تبيّن أن كل التعيينات تفشل — وهذا هو الـ Contradiction فقط.</li><li>لا تخلط: Satisfiable لا تعني أن كل الصفوف T.</li></ul></div>`];
function guide(){const t=V.gt|0;return `<div class="card" style="border-left:6px solid var(--green)" id="guide"><div class="row" style="justify-content:space-between"><h3 style="margin:0">🧭 Smart Guide • دليل القرار</h3><span class="tag ok">Propositional Logic</span></div><p class="ar" style="margin:6px 0 12px">كيف تقرّر بسرعة في الاختبار؟ ست محطات مرتبة، افتح كل واحدة بالدور.</p><div class="ftabs">${GT.map((x,i)=>`<button class="${i===t?'on':''}" data-a="gtab" data-i="${i}">${x}</button>`).join('')}</div>${GH[t]()}</div>`}
/* ---------- QUIZ ENGINE ---------- */
function startQuiz(kind,qs,meta){if(!qs.length){alert('No questions available yet.');return}clearInterval(V.timer);V.quiz={kind,questions:qs,i:0,ans:[],meta:meta||{},done:false,t:3600};
 if(kind==='final'&&S.timed){V.timer=setInterval(()=>{V.quiz.t--;$('#clock').hidden=false;$('#clock').textContent='⏳ '+fmtT(V.quiz.t);if(V.quiz.t<=0)finishQuiz()},1000);$('#clock').hidden=false;$('#clock').textContent='⏳ '+fmtT(3600)}render();scrollTo(0,0)}
const fmtT=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const TITLES={unit:'Unit Quiz',final:'🏆 Full Midterm Quiz',weak:'🎯 Turn My Weaknesses into Strengths',traps:'⭐ Traps Practice',studio:'⚙️ Custom Quiz'};
function quizView(){const Q=V.quiz;if(Q.done)return resultsView();const q=Q.questions[Q.i],a=Q.ans[Q.i],an=a!=null,sc=Q.ans.filter((x,i)=>x===Q.questions[i].correct).length,show=an&&S.instant;
 let h=`<div class="card"><div class="qhead"><b>${TITLES[Q.kind]}${Q.meta.unit?' '+Q.meta.unit:''}</b><div class="row">${S.instant?`<span class="tag ok">Score: ${sc}</span>`:''}<button class="btn ghost sm" data-a="quit">✖ Exit</button></div></div><div class="muted">Question ${Q.i+1} of ${Q.questions.length}</div><div class="bar"><i style="width:${pct(Q.i+(an?1:0),Q.questions.length)}%"></i></div>
 <div class="row" style="margin-top:12px"><span class="tag">Unit ${q.unit}</span><span class="tag gr">🔵 ${q.concept||q.topic}</span>${q.isTrap?'<span class="tag warn">⭐ Trap</span>':''}</div><div class="qtext"><span class="muted">${Q.i+1}.</span> ${q.text}</div>
 <div class="opts">${q.opts.map((o,i)=>{let c='',mk='';if(show){if(i===q.correct){c='right';mk='✅ Correct answer'}else if(i===a){c='wrong';mk='❌ Your answer'}}return `<button class="opt ${c}" ${an&&!show&&i===a?'style="border-color:var(--blue);background:var(--blueL)"':''} data-a="ans" data-i="${i}" ${an?'disabled':''}><span class="L">${'ABCD'[i]}</span><span>${o}</span>${mk?`<span class="mk">${mk}</span>`:''}</button>`}).join('')}</div>`;
 if(show){const ok=a===q.correct;h+=`<div class="fb ${ok?'ok':'no'}"><div class="h">${ok?'✅ Correct! – إجابة صحيحة':'❌ Incorrect – إجابة خاطئة'}</div><ul class="fbl">${ok?'':`<li class="bad">❌ <b>Your answer – إجابتك:</b> “${q.opts[a]}”</li>`}<li class="good">✅ <b>Correct answer – الإجابة الصحيحة:</b> “${q.opts[q.correct]}”</li><li>🇬🇧 <b>Why? (English):</b> ${q.whyEn}</li><li>🇸🇦 <b>لماذا؟ (بالعربية):</b> <span class="ari">${q.whyAr}</span></li>${q.tipGolden?`<li class="tip">💡 <b>Golden rule – القاعدة الذهبية:</b> <span class="ari">${q.tipGolden}</span></li>`:''}</ul></div>`}
 h+='</div>';if(an)h+=`<div class="row" style="justify-content:flex-end"><button class="btn ${show&&a===q.correct?'g':'b'}" data-a="next">${Q.i+1<Q.questions.length?'Next question ▶':'See my results 📊'}</button></div>`;return h}
function answer(i){const Q=V.quiz,q=Q.questions[Q.i];if(Q.ans[Q.i]!=null)return;Q.ans[Q.i]=i;const ok=i===q.correct;
 if(!ok&&S.autoWeak)S.weak[q.key]={u:q.unit,l:q.concept||q.topic};if(ok&&Q.kind==='weak')delete S.weak[q.key];save();render();if(!S.instant)setTimeout(()=>{const b=$('[data-a=next]');b&&b.scrollIntoView({block:'center'})},0)}
function finishQuiz(){const Q=V.quiz;clearInterval(V.timer);$('#clock').hidden=true;const c=Q.questions.filter((q,i)=>Q.ans[i]===q.correct).length,t=Q.questions.length;Q.done=true;Q.result={c,t};
 Q.questions.forEach((q,i)=>{if(Q.ans[i]!==q.correct&&S.autoWeak)S.weak[q.key]={u:q.unit,l:q.concept||q.topic}});
 if(Q.kind==='unit'){const o=S.unitQuiz[Q.meta.unit];if(!o||pct(c,t)>=pct(o.score,o.total))S.unitQuiz[Q.meta.unit]={score:c,total:t}}
 if(Q.kind==='final'&&(!S.best||pct(c,t)>=pct(S.best.score,S.best.total)))S.best={score:c,total:t,date:new Date().toLocaleDateString()};save();render();scrollTo(0,0)}
const LV=p=>p>=85?['ok','🌟 Excellent – ممتاز','You are ready for this part of the midterm.','أنت جاهز لهذا الجزء من الاختبار.']:p>=70?['ok','👍 Good – جيد','Review the missed items and try again.','راجع الأخطاء ثم أعد المحاولة.']:p>=50?['warn','📈 Keep practicing – تابع التدريب','Go back to the rules and flashcards.','ارجع إلى القواعد والبطاقات.']:['bad','⚠ Needs review – يحتاج مراجعة','Study the rules step by step, then retry.','ذاكر القواعد خطوة بخطوة ثم أعد المحاولة.'];
function resultsView(){const Q=V.quiz,r=Q.result,p=pct(r.c,r.t),L=LV(p),miss=Q.questions.map((q,i)=>[q,i]).filter(([q,i])=>Q.ans[i]!==q.correct),tp=[...new Set(miss.map(([q])=>q.concept||q.topic))];
 let h=`<div class="card" style="text-align:center"><div class="muted">${Q.kind==='final'?'MIDTERM READINESS REPORT':'RESULTS'}</div><div class="big-score">${r.c} / ${r.t}</div><div style="font-size:24px;font-weight:800">${p}%</div><div class="tag ${L[0]}" style="font-size:17px;margin-top:10px">${L[1]}</div><p style="margin:10px 0 0">${L[2]}</p><p class="ar" style="text-align:center;margin:0">${L[3]}</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-a="retry">🔄 Try again</button><button class="btn ghost" data-a="reviewAns">📋 Review my answers</button><button class="btn ghost" data-a="nav" data-p="home">🏠 Dashboard</button></div></div>`;
 if(tp.length)h+=`<div class="card"><h3>🎯 Topics to review • مواضيع للمراجعة</h3><div class="box warn"><ul class="fbl">${tp.map(x=>`<li class="tip">⚠ ${x}</li>`).join('')}</ul></div><div class="ar">تمت إضافتها إلى «نقاط الضعف» لإعادة اختبارها.</div></div>`;
 if(Q.showReview)h+=`<div class="card"><h3>📋 My answers</h3>${Q.questions.map((q,i)=>{const ok=Q.ans[i]===q.correct;return `<div class="box ${ok?'aff':'neg'}"><b>${i+1}. ${q.text}</b><div>${ok?'✅':'❌'} Your answer: ${Q.ans[i]==null?'—':q.opts[Q.ans[i]]}</div>${ok?'':`<div>✅ Correct: <b>${q.opts[q.correct]}</b></div><div class="muted">${q.whyEn}</div><div class="ar">${q.whyAr}</div>${q.tipGolden?`<div class="ar">💡 ${q.tipGolden}</div>`:''}`}</div>`}).join('')}</div>`;return h}
/* ---------- TRAPS / WEAK / STUDIO / FINAL ---------- */
function trapsView(){const tq=QUESTION_BANK.filter(q=>q.isTrap),dk=diffKeys();let h=`<div class="card hero"><h2>⭐ Difficult Traps</h2><div style="opacity:.9">أهم الفخاخ الامتحانية لكل وحدة + البطاقات التي علّمتها صعبة.</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-a="startTraps">▶ Practice ${tq.length} trap questions</button></div></div>`;
 UNITS.forEach(u=>{const a=(RULES_DATA[u.n]||[]).map(r=>r.steps&&r.steps[4]).filter(x=>x&&x.trap),b=tq.filter(q=>q.unit===u.n),d=dk.filter(k=>k.startsWith(u.n+':'));if(!a.length&&!b.length&&!d.length)return;
  h+=`<div class="topicHead"><span>Unit ${u.n}</span>${u.t}</div><div class="card">${a.map(x=>`<div class="box neg"><h4>❌ Trap</h4><div class="ar" style="font-weight:700">${x.trap}</div>${x.tipGolden?`<div class="ar" style="margin-top:6px">💡 ${x.tipGolden}</div>`:''}</div>`).join('')}${b.map(q=>`<div class="box warn"><h4>⭐ ${q.concept}</h4><div class="ar" style="font-weight:700">${q.tipGolden}</div></div>`).join('')}${d.map(k=>{const w=cards(u.n)[+k.split(':')[1]];return w?`<div class="box q"><h4>🃏 Marked difficult</h4><b>${w.term}</b><div class="ar">${w.arDesc}</div></div>`:''}).join('')}</div>`});h+=`<div class="topicHead"><span>Unit 1</span>ملخص الفخاخ الامتحانية الذهبية (المرجع)</div><div class="card"><div class="refbody ar">${REF[9].h}</div></div>`;return h}
function weakView(){const k=weakKeys();if(!k.length)return card(`<h2>🎯 My Weak Areas</h2><p class="ar">ما عندك نقاط ضعف مسجلة ✨ أخطاؤك في الكويزات تُضاف هنا تلقائياً مع القاعدة الذهبية.</p>`);
 return `<div class="card hero"><h2>🎯 My Weak Areas</h2><div style="opacity:.9">${k.length} topic(s) • Turn weaknesses into strengths</div><div class="row" style="margin-top:12px"><button class="btn ghost" data-a="startWeak">▶ Practice my weaknesses</button></div></div><div class="card">${k.map(x=>{const q=QUESTION_BANK.find(z=>z.id===x),w=S.weak[x];return `<div class="box neg"><h4>Unit ${w.u} • ${w.l}</h4>${q?`<div style="font-weight:700">${q.text}</div><div class="ar" style="margin-top:6px">💡 ${q.tipGolden}</div>`:'<div class="ar">سؤال مولَّد: أعد التدريب عليه من «Practice my weaknesses».</div>'}<button class="btn ghost sm" style="margin-top:8px" data-a="dropWeak" data-k="${x}">✓ Got it</button></div>`}).join('')}</div>`}
function stInfo(){const st=V.st,av=stAvail(st.units,st.traps),n=Math.min(st.n,av),bad=st.n>av&&av>0,none=!st.units.length;
 return `<div class="box ${n<1?'warn':'q'}" style="margin-top:12px"><h4>📊 الملخص</h4><div class="ar">المتاح من البنك للوحدات المختارة: <b>${av}</b> • المطلوب: <b>${st.n}</b> • سيُسحب: <b>${n}</b></div>${bad?`<div class="ar" style="color:var(--red);font-weight:700">⚠ طلبت ${st.n} لكن المتاح ${av} فقط، فسيُسحب ${av}.</div>`:''}${none?'<div class="ar" style="color:var(--red);font-weight:700">⚠ اختر وحدة واحدة على الأقل.</div>':''}${!none&&av===0?'<div class="ar" style="color:var(--red);font-weight:700">⚠ لا توجد أسئلة بهذه الإعدادات (جرّب إلغاء «الفخاخ فقط»).</div>':''}${!none&&st.n===0?'<div class="ar" style="color:var(--red);font-weight:700">⚠ حرّك السلايدر لاختيار عدد أكبر من 0.</div>':''}</div><button class="btn" style="margin-top:10px" data-a="startStudio" ${n<1?'disabled':''}>▶ ابدأ (${n} سؤال)</button>`}
function studioView(){const st=V.st;return `<div class="card hero"><h2>⚙️ Quiz Studio</h2><div style="opacity:.9">صمّم اختبارك: اختر الوحدات وعدد الأسئلة (0–40) ونسحب من البنك.</div></div><div class="card"><h3>1) الوحدات</h3><div class="subtabs"><button data-a="stAll">✓ كل الوحدات</button><button data-a="stNone">✗ إلغاء الكل</button></div><div class="picker">${UNITS.map(u=>{const on=st.units.includes(u.n);return `<button class="${on?'on rd':''}" data-a="stU" data-u="${u.n}"><span class="pi">📘</span><span><b>Unit ${u.n}</b><small>${u.t} • متاح ${avail(u.n,st.traps)}</small></span><span class="tag ${on?'ok':''}">${on?'✓':''}</span></button>`}).join('')}</div><h3>2) عدد الأسئلة: <span id="stn">${st.n}</span></h3><input class="rng" type="range" min="0" max="40" step="1" value="${st.n}" data-a="stSlide"><div class="row" style="justify-content:space-between"><span class="muted">0</span><button class="btn ghost sm" data-a="stMax">كل المتاح</button><span class="muted">40</span></div><label class="chk"><input type="checkbox" data-a="stT" ${st.traps?'checked':''}> <span class="ar" style="display:inline">أسئلة الفخاخ فقط</span></label><div id="stinfo">${stInfo()}</div></div>`}
const finalSet=()=>{const a=QUESTION_BANK.map(norm);let k=0;while(a.length<QUESTION_BANK.length+6&&k++<400){const g=nq(genQ());if(!a.some(x=>x.text===g.text))a.push(g)}return shuffle(a)};
function finalView(){const n=QUESTION_BANK.length+6;return `<div class="card hero"><h2>🏆 Full Midterm Quiz</h2><div style="opacity:.9">كل الوحدات في اختبار واحد • ${n} سؤال${S.timed?' • 60 دقيقة':''}</div></div><div class="card"><p style="margin:0 0 6px">All units mixed: curated questions + fresh generated truth-table questions. Every retry is different.</p><p class="ar" style="margin:0 0 12px">${S.timed?'المؤقت يبدأ مع أول سؤال ويُسلَّم تلقائياً عند انتهاء الوقت.':'المؤقت متوقف (يمكن تفعيله من الإعدادات).'}</p>${S.best?`<div class="tag ok" style="margin-bottom:10px">Best: ${S.best.score}/${S.best.total} • ${S.best.date}</div><br>`:''}<button class="btn p" data-a="startFinal">▶ Start the exam</button></div>`}
/* ---------- misc ---------- */
const FOOT='<div class="muted ar" style="text-align:center;font-size:13px;margin-top:8px">🧪 نموذج تجريبي قيد التطوير — قد تحتوي بعض المحتويات على أخطاء، راجع سلايدات الدكتور دائماً.</div>';
function welcome(){$('#modalRoot').innerHTML=`<div class="modal"><div class="card fade"><h2>🧪 نموذج تجريبي</h2><p class="ar">هذه النسخة <b>تجريبية وقيد التطوير</b> بإذن الله. قد تحتوي بعض الأسئلة أو الشروحات على أخطاء، فاعتمد دائماً على سلايدات الدكتور وكتاب Rosen ولا تعتبر هذا الملف مرجعاً نهائياً.</p><p class="ar">تقدّمك يُحفظ في متصفحك فقط.</p><div class="row"><button class="btn p" data-a="welcomeGuide">📖 اقرأ الدليل</button><button class="btn ghost" data-a="welcomeOk">فهمت، ابدأ</button></div></div></div>`}
const gs=(ic,t,b)=>`<div class="card"><h3>${ic} ${t}</h3>${b}</div>`,ol=a=>`<ol class="exl ar" style="padding-inline-start:24px">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`,ul=a=>`<ul class="ar" style="padding-inline-start:24px;margin:0">${a.map(x=>`<li style="margin:6px 0">${x}</li>`).join('')}</ul>`;
function guideView(){return `<div class="card hero"><h2>📖 دليل الاستخدام</h2><div style="opacity:.9">شرح كامل للأزرار والخطوات</div><div class="tag warn" style="margin-top:8px">🧪 نموذج تجريبي قيد التطوير</div></div>`+
gs('🧪','عن هذا النموذج',ul(['نموذج <b>تجريبي وقيد التطوير</b> بإذن الله، لمراجعة مقرر CS1302 (Discrete Structures 1).','قد توجد أخطاء في بعض الأسئلة أو الشروحات. <b>المرجع الرسمي</b> دائماً سلايدات الدكتور وكتاب Rosen، وإذا اختلف شرح هنا عن حل الدكتور فاتبع الدكتور.','الوحدة 1 هي الأكمل. الوحدات 2–6 فيها بطاقات وسؤال واحد فقط حالياً وتنتظر مادتها.','إذا لقيت خطأ، أخبر صاحب الملف ليصحّحه.']))+
gs('🗺️','التنقل',ul(['<b>☰</b> (في الجوال) يفتح القائمة الجانبية، وفي الشاشات الكبيرة تظهر ثابتة.','<b>Home / Dashboard:</b> إحصائياتك وتقدّم كل وحدة والإعدادات.','<b>Unit 1…6:</b> محتوى كل وحدة، والرقم الصغير بجانبها هو أفضل نتيجة كويز لك.','<b>⭐ Difficult Traps • 🎯 My Weak Areas • ⚙️ Quiz Studio • 🏆 Full Midterm Quiz:</b> شرحها في الأسفل.','<b>🌓</b> الوضع الليلي/النهاري • <b>📖 دليل</b> هذه الصفحة.']))+
gs('📘','داخل الوحدة (3 تبويبات)',ul(['<b>🟣 Concepts:</b> بطاقات المصطلحات (Flashcards) أو قائمة كل المصطلحات (All terms).','<b>🔵 Rules:</b> شرح القواعد بأربع خطوات (ما هي؟ / كيف تُبنى؟ / أمثلة / تجنّب الخطأ). أزرار الخطوات في أعلى كل قاعدة تنقلك مباشرة. في الوحدة 1 يوجد أيضاً 🧭 Smart Guide.','<b>📝 Unit Quiz:</b> اختبار قصير على الوحدة.']))+
gs('🃏','أزرار البطاقات',ol(['اضغط على البطاقة لتنقلب وترى الشرح بالإنجليزي والعربي والأمثلة.','<b>◀ Previous / Next ▶:</b> البطاقة السابقة/التالية (يعمل أيضاً بالأسهم في لوحة المفاتيح).','<b>🔀 Shuffle:</b> خلط الترتيب.','<b>✓ Known:</b> أتقنتها (تزيد نسبة Concepts).','<b>⭐ Difficult:</b> صعبة عليّ (تظهر في Difficult Traps).']))+
gs('📝','كويز الوحدة: الخطوات',ol(['افتح الوحدة ← تبويب <b>Unit Quiz</b>.','حدّد عدد الأسئلة بالسلايدر (من 3 إلى 10) أو اضغط <b>📚 كامل بنك الوحدة</b>. يظهر لك عدد المتاح. إذا كانت الوحدة فيها أقل من 3 أسئلة يبدأ الكويز بكامل البنك تلقائياً.','اضغط <b>▶ ابدأ</b> ثم اختر إجابتك.','في وضع التصحيح الفوري يظهر الصح والخطأ مع الشرح بالإنجليزي والعربي و<b>القاعدة الذهبية</b>، ثم <b>Next</b>.','في النهاية ترى النتيجة و«مواضيع للمراجعة». أزرار: <b>Try again</b> • <b>Review my answers</b> • <b>Dashboard</b>.','<b>✖ Exit</b> تخرجك من الكويز بدون حفظ نتيجته (الأخطاء السابقة تبقى في Weak Areas).']))+
gs('⚙️','Quiz Studio: اختبار مخصّص',ol(['اختر الوحدات التي تريدها (أو <b>✓ كل الوحدات</b> / <b>✗ إلغاء الكل</b>). يظهر بجانب كل وحدة عدد المتاح منها.','حرّك السلايدر من <b>0 إلى 40</b>، أو اضغط <b>كل المتاح</b>.','اختياري: فعّل <b>أسئلة الفخاخ فقط</b>.','يعرض <b>الملخص</b> المتاح والمطلوب وما سيُسحب فعلاً. إذا طلبت أكثر من المتاح يظهر تنبيه أحمر ويُسحب المتاح فقط. الزر يتعطّل إذا لم تختر وحدة أو كان العدد 0.','يُسحب العدد موزّعاً بالتساوي بين الوحدات، بدون تكرار نفس السؤال. وآخر إعدادات اخترتها تُحفظ.']))+
gs('🏆','Full Midterm Quiz',ul(['اختبار شامل مختلط (الأسئلة المنتقاة + أسئلة مولَّدة)، ويختلف في كل محاولة.','المؤقت 60 دقيقة (يظهر أعلى الصفحة) ويُسلَّم تلقائياً عند انتهاء الوقت. يمكن إيقافه من الإعدادات في Home.','يُحفظ أفضل ناتج لك (Best) ويظهر في Dashboard.']))+
gs('🎯','Weak Areas و ⭐ Difficult Traps',ul(['كل سؤال تخطئ فيه يُضاف تلقائياً إلى <b>My Weak Areas</b> (يمكن إيقاف ذلك من الإعدادات).','<b>▶ Practice my weaknesses</b> تعيد اختبارك فيها، وإذا أجبت صح تُحذف تلقائياً. أو اضغط <b>✓ Got it</b> لحذفها يدوياً.','<b>Difficult Traps</b> تجمع الفخاخ الامتحانية لكل وحدة + البطاقات التي علّمتها ⭐ ويمكنك التدرّب على أسئلة الفخاخ.']))+
gs('🔧','الإعدادات والتخزين',ul(['<b>تصحيح فوري:</b> يظهر الجواب بعد كل سؤال. إذا أوقفته تراه في نهاية الكويز.','<b>إضافة الأخطاء تلقائياً:</b> لنقاط الضعف.','<b>مؤقت 60 دقيقة:</b> للاختبار الشامل.','<b>🗑 Reset all progress:</b> يمسح كل تقدّمك.','تقدّمك محفوظ في <b>متصفحك على هذا الجهاز فقط</b> ولا يُرسل لأي مكان. مسح بيانات المتصفح أو التصفح الخاص يحذفه.']))+
gs('❓','مشاكل شائعة',ul(['الخطوط أو الألوان لا تظهر: تحتاج اتصال إنترنت.','التقدّم لم يُحفظ: غالباً التصفح الخاص أو منع التخزين.','المؤقت لا يظهر: فعّله من Home ← Settings.','أسئلة قليلة: بنك الوحدات 2–6 صغير حالياً وسيزيد مع الوقت.']))}
function welcomeClose(){S.seen=true;save();$('#modalRoot').innerHTML=''}
function go(p){clearInterval(V.timer);V.quiz=null;$('#clock').hidden=true;Object.assign(V,p);$('#side').classList.remove('open');$('#scrim').classList.remove('show');render();scrollTo(0,0)}
function render(){const T={home:'Midterm Dashboard',unit:`Unit ${V.unit}: ${U(V.unit).t}`,traps:'Difficult Traps',weak:'My Weak Areas',studio:'Quiz Studio',final:'Full Midterm Quiz',guide:'Guide • دليل الاستخدام'};$('#topTitle').textContent=V.quiz?TITLES[V.quiz.kind]:T[V.page];renderSide();
 const h=V.quiz?quizView():({home:homeView,unit:unitView,traps:trapsView,weak:weakView,studio:studioView,final:finalView,guide:guideView})[V.page]();$('#app').innerHTML=`<div class="fade">${h}</div>${V.quiz?'':FOOT}`;if(!S.seen)welcome()}
addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
 switch(a){
 case 'menu':$('#side').classList.add('open');$('#scrim').classList.add('show');break;
 case 'closeMenu':$('#side').classList.remove('open');$('#scrim').classList.remove('show');break;
 case 'nav':go({page:d.p});break;
 case 'unit':go({page:'unit',unit:+d.u,tab:'concepts',sub:'cards',fc:null});break;
 case 'tab':V.tab=d.t;render();scrollTo(0,0);break;
 case 'sub':V.sub=d.s;V.fc=null;render();break;
 case 'flip':document.querySelector('.fc').classList.toggle('flip');break;
 case 'fcNext':V.fc.i=(V.fc.i+1)%V.fc.ids.length;render();break;
 case 'fcPrev':V.fc.i=(V.fc.i-1+V.fc.ids.length)%V.fc.ids.length;render();break;
 case 'fcShuffle':shuffle(V.fc.ids);V.fc.i=0;render();break;
 case 'fcKnown':{const k=V.fc.u+':'+V.fc.ids[V.fc.i];delete S.diff[k];S.known[k]=1;save();V.fc.i=(V.fc.i+1)%V.fc.ids.length;render();break}
 case 'fcDiff':{const k=V.fc.u+':'+V.fc.ids[V.fc.i];delete S.known[k];S.diff[k]=1;save();V.fc.i=(V.fc.i+1)%V.fc.ids.length;render();break}
 case 'jump':{const t=document.getElementById(d.id);t&&t.scrollIntoView({behavior:'smooth',block:'start'});break}
 case 'startUnitQuiz':startUnit(+d.u);break;
 case 'unAll':V.un[V.unit]=V.un[V.unit]==='all'?cap(V.unit):'all';save();render();break;
 case 'startFinal':startQuiz('final',finalSet());break;
 case 'startWeak':startQuiz('weak',weakSet());break;
 case 'startTraps':startQuiz('traps',shuffle(QUESTION_BANK.filter(q=>q.isTrap).map(norm)));break;
 case 'dropWeak':delete S.weak[d.k];save();render();break;
 case 'stU':{const s=V.st.units,u=+d.u;s.includes(u)?s.splice(s.indexOf(u),1):s.push(u);save();render();break}
 case 'stAll':V.st.units=[1,2,3,4,5,6];save();render();break;
 case 'stNone':V.st.units=[];save();render();break;
 case 'stMax':V.st.n=Math.min(40,stAvail(V.st.units,V.st.traps));save();render();break;
 case 'stT':V.st.traps=el.checked;save();render();break;
 case 'startStudio':startStudio();break;
 case 'welcomeOk':welcomeClose();render();break;
 case 'welcomeGuide':welcomeClose();go({page:'guide'});break;
 case 'refOpen':{const x=document.getElementById('ref'+d.i);x.open=true;x.scrollIntoView({behavior:'smooth',block:'start'});break}
 case 'refAll':document.querySelectorAll('.refd').forEach(x=>{x.open=d.v==='1'});break;
 case 'gtab':V.gt=+d.i;render();break;
 case 'drill':{const D=V.dr,ok=PD[D.o[D.i]][1];D.p=+d.v;if(D.p===ok)D.s++;render();break}
 case 'dnext':V.dr.i++;V.dr.p=null;render();break;
 case 'dreset':V.dr=null;render();break;
 case 'ans':answer(+d.i);break;
 case 'next':{const Q=V.quiz;Q.i++;if(Q.i>=Q.questions.length)finishQuiz();else{render();scrollTo(0,0)}break}
 case 'quit':if(confirm('Exit the quiz? Your answers so far are kept in Weak Areas.')){clearInterval(V.timer);$('#clock').hidden=true;V.quiz=null;render()}break;
 case 'retry':{const Q=V.quiz,k=Q.kind;if(k==='unit')startUnit(Q.meta.unit);else if(k==='final')startQuiz('final',finalSet());else if(k==='weak')startQuiz('weak',weakSet());else if(k==='traps')startQuiz('traps',shuffle(QUESTION_BANK.filter(q=>q.isTrap).map(norm)));else if(k==='studio')startStudio(Q.meta);else{V.quiz=null;render()}break}
 case 'reviewAns':V.quiz.showReview=!V.quiz.showReview;render();break;
 case 'opt':S[d.k]=el.checked;save();break;
 case 'theme':S.dark=document.documentElement.dataset.theme!=='dark';save();applyTheme();break;
 case 'reset':if(confirm('Reset all progress?')){S={seen:true,un:{},st:null,known:{},diff:{},unitQuiz:{},weak:{},best:null,autoWeak:true,instant:true,timed:true,dark:S.dark};V.st={units:[1,2,3,4,5,6],n:10,traps:false};V.un={};S.st=V.st;S.un=V.un;save();render()}break}});
addEventListener('input',e=>{const el=e.target;if(!el||!el.dataset||!el.dataset.a)return;const a=el.dataset.a,v=+el.value;
 if(a==='unSlide'){V.un[V.unit]=v;save();$('#cntv').textContent=v}
 else if(a==='stSlide'){V.st.n=v;save();$('#stn').textContent=v;$('#stinfo').innerHTML=stInfo()}});
applyTheme();render();
</script>
</body>
</html>
