<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midterm Review • CS1302 Discrete Math</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',corePlugins:{preflight:false}}</script>
<style>
:root{
  --bg:#f3f5fb;--panel:#ffffff;--ink:#0f172a;--muted:#5b6478;--line:#e3e7f1;
  --side:#111735;--side2:#1b2350;--sideInk:#c9d0f5;
  --purple:#7c3aed;--purpleL:#f1eafe;--blue:#2563eb;--blueL:#e6efff;
  --green:#16a34a;--greenL:#e3f7ea;--red:#dc2626;--redL:#fde8e8;--amber:#d97706;--amberL:#fff3dc;
  --radius:18px;--shadow:0 6px 24px rgba(20,30,70,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:17px;line-height:1.5}
button{font:inherit;cursor:pointer;border:none;color:inherit}
.ar{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;direction:rtl;text-align:right;display:block;line-height:1.9}
.ari{font-family:"Noto Kufi Arabic",Tahoma,sans-serif;direction:rtl;unicode-bidi:isolate}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:270px;background:linear-gradient(180deg,var(--side),var(--side2));color:var(--sideInk);position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto}
.side.open{transform:none}
.side .brand{padding:22px 20px 14px;color:#fff}
.side .brand b{font-size:20px;display:block;letter-spacing:.3px}
.side .brand small{opacity:.7}
.nav{padding:6px 12px 24px;display:flex;flex-direction:column;gap:4px}
.nav button{background:transparent;text-align:left;padding:13px 14px;border-radius:12px;color:var(--sideInk);display:flex;align-items:center;gap:12px;font-weight:600;min-height:48px}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:#fff;color:var(--side)}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
.nav .pill{margin-left:auto;font-size:12px;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:99px}
.nav button.on .pill{background:var(--purpleL);color:var(--purple)}
.scrim{position:fixed;inset:0;background:rgba(10,15,40,.45);z-index:30;display:none}
.scrim.show{display:block}
.main{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,251,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menuBtn{width:48px;height:48px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);font-size:22px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
@media(min-width:1024px){
  .side{transform:none}
  .main{margin-left:270px}
  .menuBtn{display:none}
  .scrim{display:none!important}
  .wrap{padding:28px 32px 80px}
}
/* components */
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777);color:#fff;border:none}
.hero h2{margin:0 0 4px;font-size:clamp(24px,4vw,34px)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat .n{font-size:28px;font-weight:800}
.stat .l{color:var(--muted);font-size:14px;font-weight:600}
.bar{height:12px;background:#e8ebf4;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#2563eb);transition:width .6s ease}
.bar.g i{background:var(--green)}.bar.a i{background:var(--amber)}.bar.r i{background:var(--red)}.bar.b i{background:var(--blue)}.bar.p i{background:var(--purple)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;font-weight:700;background:var(--ink);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.btn.p{background:var(--purple)}.btn.b{background:var(--blue)}.btn.g{background:var(--green)}.btn.a{background:var(--amber)}.btn.r{background:var(--red)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:8px;background:var(--panel);padding:6px;border-radius:16px;border:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{flex:1;min-height:50px;border-radius:12px;background:transparent;font-weight:700;color:var(--muted);white-space:nowrap;padding:0 14px}
.tabs button.on.v{background:var(--purple);color:#fff}.tabs button.on.gr{background:var(--blue);color:#fff}.tabs button.on.q{background:var(--ink);color:#fff}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{min-height:44px;padding:0 16px;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;color:var(--muted)}
.subtabs button.on{border-color:currentColor;color:var(--purple);background:var(--purpleL)}
.subtabs.blue button.on{color:var(--blue);background:var(--blueL)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.tag.v{background:var(--purpleL);color:var(--purple)}.tag.gr{background:var(--blueL);color:var(--blue)}
.tag.ok{background:var(--greenL);color:var(--green)}.tag.bad{background:var(--redL);color:var(--red)}.tag.warn{background:var(--amberL);color:#a45a00}
h2{font-size:24px;margin:0 0 12px}h3{font-size:19px;margin:0 0 10px}
.muted{color:var(--muted)}
.hint{background:var(--purpleL);color:#5b21b6;border-radius:14px;padding:12px 16px;font-weight:600;margin-bottom:14px}
/* vocab list */
.word{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%;display:block;transition:border-color .2s}
.word:hover{border-color:var(--purple)}
.word .w{font-weight:800;font-size:19px;color:var(--purple)}
.word .pos{font-size:13px;color:var(--muted);font-style:italic;margin-left:6px}
.word .ex{font-style:italic;color:#334155;margin-top:4px}
.word .arbox{display:none;margin-top:8px;background:#faf7ff;border-radius:10px;padding:6px 12px;font-weight:700;color:#4c1d95}
.word.show .arbox{display:block}
.icon{width:44px;height:44px;border-radius:12px;background:var(--purpleL);color:var(--purple);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.icon.star.on{background:#fff3c4;color:#b45309}
/* flashcards */
.fcWrap{perspective:1400px;max-width:620px;margin:0 auto}
.fc{position:relative;height:360px;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.face.front{background:linear-gradient(135deg,#6d28d9,#4338ca);color:#fff}
.face.back{background:var(--panel);transform:rotateY(180deg);border:2px solid var(--purple);overflow-y:auto}
.face.gfront{background:linear-gradient(135deg,#1d4ed8,#0e7490);color:#fff}
.face.gback{background:var(--panel);transform:rotateY(180deg);border:2px solid var(--blue);overflow-y:auto}
.face .big{font-size:clamp(26px,5vw,40px);font-weight:800}
.fcNav{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:620px;margin:16px auto 0}
/* grammar */
.gcard{border-left:6px solid var(--blue)}
.formula{background:var(--blueL);color:#1e3a8a;border-radius:14px;padding:14px 16px;font-weight:800;font-size:18px;margin:10px 0}
.box{border-radius:14px;padding:12px 16px;margin:8px 0;border:1.5px solid}
.box.aff{background:var(--greenL);border-color:#a7e3bb}.box.neg{background:var(--redL);border-color:#f5b5b5}
.box.q{background:var(--blueL);border-color:#b7cdfb}.box.warn{background:var(--amberL);border-color:#f5d08c}
.box h4{margin:0 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.box.aff h4{color:var(--green)}.box.neg h4{color:var(--red)}.box.q h4{color:var(--blue)}.box.warn h4{color:#a45a00}
.box ul{margin:0;padding-left:20px}.box li{margin:3px 0}
table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-size:14px}
.tscroll{overflow-x:auto}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-size:clamp(20px,3vw,24px);font-weight:700;margin:14px 0 18px}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-weight:600;min-height:60px;display:flex;align-items:center;gap:12px;transition:all .15s}
.opt:hover:not([disabled]){border-color:var(--blue);background:#f8faff}
.opt .L{width:34px;height:34px;border-radius:10px;background:#eef1f8;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.opt.right{border-color:var(--green);background:var(--greenL)}.opt.right .L{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--redL)}.opt.wrong .L{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.opt .mk{margin-left:auto;font-weight:800;font-size:14px}
.fb{margin-top:16px;border-radius:16px;padding:16px;animation:pop .3s ease}
.fb.ok{background:var(--greenL);border:2px solid #9bd9b0}.fb.no{background:var(--redL);border:2px solid #f3a9a9}
.fb .h{font-size:20px;font-weight:800;margin-bottom:6px}
.fb.ok .h{color:var(--green)}.fb.no .h{color:var(--red)}
.fb .ans{background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:700}
.fb .exp{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:pop .35s ease}
.list{list-style:none;padding:0;margin:0}
.list li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big-score{font-size:clamp(40px,8vw,64px);font-weight:800;line-height:1}
.modal{position:fixed;inset:0;background:rgba(10,15,40,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .card{max-width:440px;width:100%}
input.txt{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);margin:12px 0}
input.txt:focus{outline:none;border-color:var(--purple)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;min-height:44px}
.chk input{width:24px;height:24px}
.k-be{color:#1d4ed8;background:#dbe7ff;border-radius:6px;padding:0 4px;font-weight:800}
.k-neg{color:#b91c1c;background:#fde2e2;border-radius:6px;padding:0 4px;font-weight:800}
.k-verb{color:#15803d;background:#dcf5e5;border-radius:6px;padding:0 4px;font-weight:800}
.k-pro{color:#6d28d9;background:#efe6ff;border-radius:6px;padding:0 4px;font-weight:800}
.legend{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin-bottom:18px;line-height:2.1;font-size:15px}
.stepN{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:15px;margin-right:4px}
.step{border-left:6px solid var(--blue)}
ul.fbl{margin:6px 0 0;padding-left:0;list-style:none}
ul.fbl li{background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;border-left:5px solid var(--blue)}
ul.fbl li.bad{border-left-color:var(--red);color:#991b1b}ul.fbl li.good{border-left-color:var(--green);color:#166534}
ul.fbl li.tip{border-left-color:var(--amber)}
.box ul.fbl li{background:rgba(255,255,255,.7)}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.ba .x{border-radius:14px;padding:12px}
.stepHead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.stepT{font-size:20px;font-weight:800;line-height:1.2}
.stepN.sm{width:24px;height:24px;font-size:13px}
.gnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.gnav button{display:flex;align-items:center;gap:8px;background:var(--blueL);color:#1e3a8a;border-radius:12px;padding:10px 12px;font-weight:700;min-height:46px;text-align:left}
.gnav button:hover{background:#d6e4ff}
.lang{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.lang p{margin:0;font-size:17px}
.lang .lbl{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:4px}
.rules{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.rule>span:last-child{min-width:0;overflow-wrap:anywhere}
.rule{display:flex;gap:12px;align-items:center;background:var(--blueL);color:#1e3a8a;border-radius:12px;padding:12px 14px;font-weight:800;font-size:17px}
.rule .rn{flex:none;width:28px;height:28px;border-radius:8px;background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.arnote{font-weight:600;background:#fafbff;border-radius:12px;padding:8px 14px;margin-top:10px}
.ftabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.ftabs button{flex:none;min-height:44px;padding:0 14px;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);font-weight:700;color:var(--muted);white-space:nowrap}
.ftabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
ol.exl{margin:0;padding-left:22px}
ol.exl li{margin:6px 0;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
ol.exl li span{margin-right:8px}
ol.exl li button{vertical-align:middle}
.step{scroll-margin-top:84px}
.nextc{background:linear-gradient(135deg,#eef4ff,#f5f0ff)}
.legend{margin:12px 0 0}
.topicHead{scroll-margin-top:84px;margin:28px 0 12px;padding:14px 18px;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#0e7490);color:#fff;font-size:21px;font-weight:800}
.topicHead span{display:block;font-size:13px;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.gcard{scroll-margin-top:84px}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:18px}
.picker button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-height:64px}
.picker button small{display:block;color:var(--muted);font-weight:600;font-size:13px;line-height:1.3}
.picker .pi{font-size:24px;flex:none}
.picker .tag{margin-left:auto;flex:none}
.picker button.on.rd{border-color:var(--green);background:var(--greenL)}
.picker button.on.ls{border-color:var(--amber);background:var(--amberL)}
.passage p{font-size:18px;line-height:1.75;margin:0 0 14px}
.passage .pn{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;font-weight:800;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
.passage{border-left:6px solid var(--green)}
.player{border-left:6px solid var(--amber)}
.rlq{padding:16px 0;border-bottom:1px dashed var(--line)}
.rlq:first-of-type{padding-top:4px}
.arOff .tr{display:none!important}
.passage p.tr,.script p.tr{background:#f6f8fc;border-radius:12px;padding:8px 14px;font-size:16px;color:#334155;margin-top:-6px}
.arbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:18px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:99px;background:#e2e6f0;font-weight:800;color:var(--muted)}
.sw i{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sw.on{background:var(--green);color:#fff;flex-direction:row-reverse;padding:0 6px 0 14px}
.script{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;padding:4px 16px;background:#fffdf7}
.script summary{cursor:pointer;font-weight:800;padding:12px 0;min-height:44px}
.script p{margin:0 0 12px;font-size:17px;line-height:1.7}
.spk{color:#c2410c}
#rlWrap:not(.arOff) .tw{cursor:pointer;border-bottom:1.5px dotted #94a3b8;border-radius:4px}
#rlWrap:not(.arOff) .tw:hover,.tw.sel{background:#fef08a}
#twTip{position:absolute;z-index:90;background:#0f172a;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 16px);animation:pop .15s ease}
#twTip b{font-size:15px;opacity:.75;font-weight:600}
#twTip .ari{font-size:19px;font-weight:700}
#twTip button{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);flex:none}
.paper{border-radius:10px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sechead{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:16px}
.exinst{background:#f4f6fb;border-left:5px solid var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.expass{border:1.5px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:16px;background:#fffef9}
.expass p{font-size:17px;line-height:1.7;margin:0 0 12px}
.exgrid{display:grid;gap:18px 28px;grid-template-columns:1fr}
@media(min-width:800px){.exgrid{grid-template-columns:1fr 1fr}}
.exqt{font-weight:600;margin-bottom:8px}
.exo{display:grid;gap:6px}
.exo button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px;font-weight:600}
.exo button:hover:not([disabled]){border-color:var(--blue)}
.exo .L{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.exo button.sel{border-color:var(--ink);background:#eef1ff}.exo button.sel .L{background:var(--ink);color:#fff}
.exo button.right{border-color:var(--green);background:var(--greenL)}.exo button.right .L{background:var(--green);border-color:var(--green);color:#fff}
.exo button.wrong{border-color:var(--red);background:var(--redL)}.exo button.wrong .L{background:var(--red);border-color:var(--red);color:#fff}
.exo button[disabled]{cursor:default}
.exfb{margin-top:8px;border-radius:10px;padding:8px 12px;font-size:15px}
.exfb.ok{background:var(--greenL)}.exfb.no{background:var(--redL)}
.exhr{border:none;border-top:2px dashed var(--line);margin:22px 0}
.exsc{font-size:12px;opacity:.75;margin-left:4px}
#exTimer.late{background:var(--redL);color:var(--red)}

.fc{height:clamp(440px,70vh,560px)}
.m{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;font-size:.95em}.dm{display:block;text-align:center;margin:8px 0;overflow-x:auto}

(function(){const T='Unit 1: Propositional Logic',A=(id,c,tr,text,o,k,en,ar,tip)=>QUESTION_BANK.push({id,unit:1,unitTitle:T,concept:c,topic:c,isTrap:tr,text,options:o,correct:k,whyEn:en,whyAr:ar,tipGolden:tip});
A('q_x1','Proposition Classification (Ex 2)',false,'Which of these is NOT a proposition?',['There are no black flies in Maine.','The moon is made of green cheese.','Do not pass go.','0 + 0 = 2'],2,'"Do not pass go." is a command; commands have no truth value. The other three are declarative statements (T or F).','"Do not pass go" أمر Command، والأمر لا يوصف بصح أو خطأ. الباقي جمل خبرية لها قيمة T أو F.','الأمر ليس Proposition.');
A('q_x2','Unknown Variable (Ex 2)',false,'Is "2n ≥ 100" a proposition?',['Yes, it is always true','Yes, it is always false','No, it contains an unknown variable n','No, it is a question'],2,'Its truth value depends on n, so it has no definite value until n is given.','قيمتها تعتمد على n، فلا قيمة T أو F قاطعة حتى نعوّض n.','مجهول بلا تعيين = Not a proposition.');
A('q_x3','False Statements Are Propositions',true,'The statement "0 + 0 = 2" is:',['Not a proposition because it is false','A proposition whose truth value is F','A proposition whose truth value is T','Not a proposition because it is an equation'],1,'It is a declarative statement with a definite value (F). Being false does not stop it from being a proposition.','جملة خبرية قيمتها قاطعة F. كونها كاذبة لا يمنع أن تكون Proposition.','الكذب لا يلغي كونها Proposition.');
A('q_x4','Biconditional Truth Value (Ex 18a)',false,'What is the truth value of "2 + 2 = 4 if and only if 1 + 1 = 2"?',['True','False'],0,'Both sides are T, and a biconditional with equal sides is T.','الطرفان T والشرط الثنائي صائب عند تشابه القيمتين.','↔ صائبة عند التشابه.');
A('q_x5','Biconditional Truth Value (Ex 18d)',false,'What is the truth value of "0 > 1 if and only if 2 > 1"?',['True','False'],1,'The left side is F and the right side is T. Different values make the biconditional F.','الطرف الأيسر F والأيمن T، اختلفا فالشرط الثنائي F.','↔ خاطئة عند الاختلاف.');
A('q_x6','Vacuous Truth (Ex 19c)',true,'What is the truth value of "If 1 + 1 = 3, then 2 + 2 = 5"?',['True','False'],0,'The hypothesis is F, so the conditional is T regardless of the conclusion.','الفرضية F، فالعبارة الشرطية T مهما كانت النتيجة.','فرضية F ⇒ الشرطية T فوراً.');
A('q_x7','Conditional Truth Value (Ex 20d)',false,'What is the truth value of "If 1 + 1 = 2, then dogs can fly"?',['True','False'],1,'Hypothesis T and conclusion F is the only case where p → q is F.','الفرضية T والنتيجة F وهي الحالة الوحيدة التي تكون فيها p → q خاطئة.','p → q خاطئة فقط عند T ثم F.');
A('q_x8','"But" Translation (Ex 16a)',false,'Let p: You get an A on the final, q: You do every exercise, r: You get an A in this class. Translate: "You get an A in this class, but you do not do every exercise."',['r ∧ ¬q','r → ¬q','¬r ∧ q','r ∨ ¬q'],0,'"But" is translated as conjunction (∧).','كلمة but تُترجم دائماً إلى وصل ∧.','but = ∧.');
A('q_x9','Converse (Ex 30b)',false,'What is the converse of "I go to the beach whenever it is a sunny summer day"?',['If I go to the beach, then it is a sunny summer day.','If it is a sunny summer day, then I go to the beach.','If I do not go to the beach, then it is not a sunny summer day.','If it is not a sunny summer day, then I do not go to the beach.'],0,'"whenever" marks the hypothesis p (sunny day). Original p → q; converse is q → p.','whenever تحدد الفرضية p (يوم مشمس)، والأصل p → q، والعكس Converse هو q → p.','ما بعد whenever فرضية، والعكس يبدّل الأماكن.');
A('q_x10','Truth Table Rows (Ex 31a)',false,'How many rows does the truth table of p → ¬p have?',['1','2','4','8'],1,'Only one distinct variable (p), so 2^1 = 2 rows.','متغير فريد واحد فقط (p) إذن 2^1 = 2 صفان.','الصفوف = 2^n للمتغيرات الفريدة.');
A('q_x11','Satisfiability (Ex 66)',false,'(p ∨ q ∨ ¬r) ∧ (p ∨ ¬q ∨ ¬s) ∧ (p ∨ ¬r ∨ ¬s) ∧ (¬p ∨ ¬q ∨ ¬s) ∧ (p ∨ q ∨ ¬s) is:',['Satisfiable (e.g. p=T, q=F, r=T, s=F)','Unsatisfiable','A tautology','A contradiction'],0,'With p = T the 1st, 2nd, 3rd and 5th clauses are T. With q = F the 4th clause is T too.','عند p = T تصير الأقواس 1 و 2 و 3 و 5 صائبة، وعند q = F يصير القوس الرابع صائباً.','يكفي تعيين واحد لتكون Satisfiable.');
A('q_x12','Unsatisfiable (SAT problem 3)',false,'(p ∨ ¬q) ∧ (q ∨ ¬r) ∧ (r ∨ ¬p) ∧ (p ∨ q ∨ r) ∧ (¬p ∨ ¬q ∨ ¬r) is:',['Satisfiable with p = q = r = T','Satisfiable with p = q = r = F','Unsatisfiable','A tautology'],2,'The first three clauses force p = q = r. All T fails the last clause; all F fails the fourth.','الأقواس الثلاثة الأولى تفرض تساوي p و q و r. الكل T يُسقط القوس الأخير، والكل F يُسقط القوس الرابع.','لإثبات Unsatisfiable بيّن أن كل التعيينات تفشل.');
A('q_x13','XOR (Ex 34c)',false,'What is p ⊕ (p ∨ q) when p = F and q = T?',['T','F'],0,'p ∨ q = T, and F ⊕ T = T because the values differ.','p ∨ q = T، وF ⊕ T = T لأن القيمتين مختلفتان.','⊕ صائبة عند الاختلاف.');
A('q_x14','De Morgan Law Name',false,'Which law justifies ¬(p ∨ q) ≡ ¬p ∧ ¬q?',['De Morgan\'s law','Absorption law','Distributive law','Idempotent law'],0,'Negating a disjunction gives a conjunction of negations: De Morgan.','نفي الفصل يتحول إلى وصل نفيين: قانون دي مورغان.','De Morgan يبدّل ∧ و ∨ مع النفي.');
A('q_x15','Negating "or" (Ex 8d)',true,'What is the negation of "Rita will move to Oregon or Washington"?',['Rita will not move to Oregon and she will not move to Washington.','Rita will not move to Oregon or she will not move to Washington.','Rita will move to Oregon and Washington.','If Rita moves to Oregon, she does not move to Washington.'],0,'¬(p ∨ q) ≡ ¬p ∧ ¬q.','¬(p ∨ q) ≡ ¬p ∧ ¬q: نفي "أو" يصير "و" بين نفيين.','نفي ∨ يصير ∧ (وليس ∨).');
A('q_x16','Tautology Check (Ex 36c)',false,'p ⊕ ¬p is:',['Tautology','Contradiction','Contingency','Unsatisfiable'],0,'p and ¬p always differ, so the XOR is T in every row.','p و¬p دائماً مختلفتان، لذلك ⊕ بينهما T في كل الصفوف.','Tautology = كل الصفوف T.');})();

const REF=[{"s": "Propositions", "t": "مفهوم العبارة المنطقية (Propositions) وتصنيف الجمل", "h": "<h3>1.1 التعريف الأكاديمي الدقيق<\/h3>\n<ul>\n<li><strong>العبارة المنطقية (Proposition):<\/strong> هي جملة خبرية تصريحية (Declarative Statement) تحتمل إحدى قيمتين فقط: إما صائبة (<span class=\"m\">T<\/span> - True) أو خاطئة (<span class=\"m\">F<\/span> - False)، ولا يمكن أن تحتمل القيمتين معاً، ولا يمكن أن تكون خارج نطاق هاتين القيمتين.<\/li>\n<li><strong>قيمة الصواب (Truth Value):<\/strong> هي القيمة المنطقية التي تأخذها العبارة، وتُمثل رمزياً بـ <span class=\"m\">T<\/span> أو <span class=\"m\">F<\/span>.<\/li>\n<li><strong>متغيرات العبارات (Propositional Variables):<\/strong> نرمز للعبارات المنطقية البسيطة بحروف إنجليزية صغيرة، والاصطلاح المعياري في المقرر يبدأ بـ:\n<div class=\"m dm\">p, q, r, s, t, …<\/div><\/li>\n<\/ul>\n<h3>1.2 معيار استبعاد الجمل (متى تسقط الجملة وتُصنف Not a Proposition؟)<\/h3>\n<p>في اختبارات أم القرى، هذا السؤال من الكلاسيكيات الثابتة. الجملة <strong>ليست عبارة منطقية<\/strong> إذا وقعت في إحدى الحالات الأربع التالية:<\/p>\n<ol>\n<li><strong>الأمر أو التوجيه (Command / Imperative):<\/strong><ul>\n<li>مثل: <code>Sit down!<\/code> أو <code>Do not pass go.<\/code><\/li>\n<li><em>السبب:<\/em> لا يمكن وصف الأمر بأنه &quot;صحيح&quot; أو &quot;خاطئ&quot;.<\/li>\n<\/ul>\n<\/li>\n<li><strong>السؤال أو الاستفسار (Question / Interrogative):<\/strong><ul>\n<li>مثل: <code>What time is it?<\/code><\/li>\n<li><em>السبب:<\/em> السؤال يطلب معلومة، ولا يحمل تقريراً خبرياً يمكن الحكم عليه.<\/li>\n<\/ul>\n<\/li>\n<li><strong>المعادلات والتعابير التي تحتوي على متغيرات مجهولة غير محددة (Unknown Variables):<\/strong><ul>\n<li>مثل: <span class=\"m\">x + 1 = 2<\/span> أو <span class=\"m\">x + y = z<\/span> أو <span class=\"m\">4 + x = 5<\/span> أو <span class=\"m\">2n ≥ 100<\/span>.<\/li>\n<li><em>السبب:<\/em> لا يمكن تحديد قيمة الصواب (<span class=\"m\">T<\/span> أو <span class=\"m\">F<\/span>) حتى تُعطى قيمة عددية محددة للمجهول <span class=\"m\">x<\/span> أو <span class=\"m\">n<\/span>. (هذه التعابير تُدرس لاحقاً في المقرر كدوال خبرية Predicates).<\/li>\n<\/ul>\n<\/li>\n<li><strong>العبارات المفارقة أو غير المحددة (Paradoxes / Opinions):<\/strong><ul>\n<li>مثل: &quot;This statement is false&quot;.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>1.3 أمثلة السلايدات المعتمدة وتصنيفها<\/h3>\n<ul>\n<li><code>&quot;The Moon is made of green cheese.&quot;<\/code> <span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (وقيمتها <span class=\"m\">F<\/span>).<\/li>\n<li><code>&quot;Makkah is the Holy City of Islam.&quot;<\/code> <span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (وقيمتها <span class=\"m\">T<\/span>).<\/li>\n<li><code>&quot;Madina is the capital of Saudi Arabia.&quot;<\/code> <span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (وقيمتها <span class=\"m\">F<\/span>).<\/li>\n<li><code><span class=\"m\">1 + 0 = 1<\/span><\/code> <span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (وقيمتها <span class=\"m\">T<\/span>).<\/li>\n<li><code><span class=\"m\">0 + 0 = 2<\/span><\/code> <span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (وقيمتها <span class=\"m\">F<\/span>).<\/li>\n<li><code>&quot;Sit down!&quot;<\/code> <span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (أمر).<\/li>\n<li><code>&quot;What time is it?&quot;<\/code> <span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (سؤال).<\/li>\n<li><code><span class=\"m\">x + 1 = 2<\/span><\/code> <span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (تحتوي على مجهول <span class=\"m\">x<\/span>).<\/li>\n<li><code><span class=\"m\">x + y = z<\/span><\/code> <span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (مجاهيل دون تعيين قيم).<\/li>\n<\/ul>\n"}, {"s": "Connectives", "t": "الروابط المنطقية الأساسية وجداول الصواب (Basic Connectives & Truth Tables)", "h": "<p>العبارة المركبة (Compound Proposition) تُبنى من ربط عبارتين بسيطتين أو أكثر باستخدام روابط منطقية (Logical Connectives).<\/p>\n<h3>2.1 النفي (Negation) <span class=\"m\">¬ p<\/span><\/h3>\n<ul>\n<li><strong>الرمز والقراءة:<\/strong> <span class=\"m\">¬ p<\/span> أو <span class=\"m\">~ p<\/span>، ويُقرأ &quot;not <span class=\"m\">p<\/span>&quot; أو &quot;It is not the case that <span class=\"m\">p<\/span>&quot;.<\/li>\n<li><strong>الوظيفة:<\/strong> عكس قيمة الصواب. إذا كانت <span class=\"m\">p<\/span> صائبة تصبح <span class=\"m\">¬ p<\/span> خاطئة، والعكس.<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>أمثلة السلايدات على النفي اللفظي:<\/strong><ul>\n<li><span class=\"m\">p<\/span>: &quot;The earth is round.&quot; <span class=\"m\">⇒<\/span> <span class=\"m\">¬ p<\/span>: &quot;It is not the case that the earth is round&quot; أو &quot;The earth is not round.&quot;<\/li>\n<li>&quot;It is raining today.&quot; <span class=\"m\">⇒<\/span> &quot;It is not raining today.&quot;<\/li>\n<li>&quot;2 is a prime number.&quot; <span class=\"m\">⇒<\/span> &quot;2 is not a prime number.&quot;<\/li>\n<li>&quot;There are other life forms on other planets in the universe.&quot; <span class=\"m\">⇒<\/span> &quot;It is not the case that there are other life forms on other planets in the universe.&quot;<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>2.2 الوصل (Conjunction) <span class=\"m\">p ∧ q<\/span><\/h3>\n<ul>\n<li><strong>الرمز والقراءة:<\/strong> <span class=\"m\">p ∧ q<\/span>، ويُقرأ &quot;<span class=\"m\">p<\/span> and <span class=\"m\">q<\/span>&quot;.<\/li>\n<li><strong>القاعدة:<\/strong> تكون العبارة صائبة (<span class=\"m\">T<\/span>) <strong>فقط وفقط إذا كان كلا الطرفين صائبين (<span class=\"m\">p = T<\/span> و <span class=\"m\">q = T<\/span>)<\/strong>. وجود أي طرف بقيمة <span class=\"m\">F<\/span> يجعل العبارة بالكامل <span class=\"m\">F<\/span>.<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ∧ q<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>مثال السلايدات:<\/strong><ul>\n<li><span class=\"m\">p<\/span>: &quot;I am at home.&quot;<\/li>\n<li><span class=\"m\">q<\/span>: &quot;It is raining.&quot;<\/li>\n<li><span class=\"m\">p ∧ q<\/span>: &quot;I am at home and it is raining.&quot;<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>2.3 الفصل الشامل (Disjunction) <span class=\"m\">p ∨ q<\/span><\/h3>\n<ul>\n<li><strong>الرمز والقراءة:<\/strong> <span class=\"m\">p ∨ q<\/span>، ويُقرأ &quot;<span class=\"m\">p<\/span> or <span class=\"m\">q<\/span>&quot; (ويُسمى Inclusive OR).<\/li>\n<li><strong>القاعدة:<\/strong> تكون العبارة صائبة (<span class=\"m\">T<\/span>) <strong>إذا كان أحد الطرفين على الأقل صائباً<\/strong>. وتكون خاطئة (<span class=\"m\">F<\/span>) في حالة واحدة فقط: <strong>إذا كان كلا الطرفين خاطئين (<span class=\"m\">p = F<\/span> و <span class=\"m\">q = F<\/span>)<\/strong>.<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ∨ q<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>2.4 الفصل الإقصائي (Exclusive OR - XOR) <span class=\"m\">p ⊕ q<\/span><\/h3>\n<ul>\n<li><strong>الرمز والقراءة:<\/strong> <span class=\"m\">p ⊕ q<\/span>، ويُقرأ &quot;<span class=\"m\">p<\/span> xor <span class=\"m\">q<\/span>&quot;.<\/li>\n<li><strong>القاعدة الذهبية:<\/strong><ul>\n<li>صائبة (<span class=\"m\">T<\/span>) إذا <strong>اختلفت<\/strong> قيمتا الطرفين (أحدهما <span class=\"m\">T<\/span> والآخر <span class=\"m\">F<\/span>).<\/li>\n<li>خاطئة (<span class=\"m\">F<\/span>) إذا <strong>تشابهت<\/strong> قيمتا الطرفين (كلاهما <span class=\"m\">T<\/span> أو كلاهما <span class=\"m\">F<\/span>).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ⊕ q<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>2.5 الفرق الجوهري في اللغة الإنجليزية بين Inclusive OR و Exclusive OR<\/h3>\n<p>في أسئلة الاختبار النصية والترجمة، يجب التدقيق في سياق الكلمة &quot;or&quot;:<\/p>\n<ol>\n<li><strong>Inclusive OR (<span class=\"m\">p ∨ q<\/span>):<\/strong> تعني <span class=\"m\">p<\/span> أو <span class=\"m\">q<\/span> أو كلاهما معاً.<ul>\n<li><em>مثال السلايدات:<\/em> <code>&quot;Students who have taken CS202 or Math120 may take this class.&quot;<\/code><\/li>\n<li>الطالب يمكنه أخذ إحدى المادتين أو كلتيهما معاً، فالشرط يتحقق.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Exclusive OR (<span class=\"m\">p ⊕ q<\/span>):<\/strong> تعني <span class=\"m\">p<\/span> أو <span class=\"m\">q<\/span> ولكن <strong>ليس كلاهما<\/strong> (&quot;but not both&quot;).<ul>\n<li><em>مثال السلايدات:<\/em> <code>&quot;Soup or salad comes with this meal.&quot;<\/code><\/li>\n<li>لا يمكن للزبون الجمع بين الحساء والسلطة في نفس الوجبة المجانية.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<h3>2.6 قاعدة عدد صفوف جدول الصواب (Truth Table Rows Rule)<\/h3>\n<p>لأي عبارة مركبة تحتوي على متغيرات منطقية:\n<div class=\"m dm\">Number of Rows = 2<sup>n<\/sup><\/div>\nحيث <span class=\"m\">n<\/span> هو <strong>عدد المتغيرات الأصلية الفريدة (Distinct Propositional Variables)<\/strong>.<\/p>\n<ul>\n<li>إذا كان لدينا <span class=\"m\">p, q<\/span> <span class=\"m\">⇒ 2<sup>2<\/sup> = 4<\/span> صفوف.<\/li>\n<li>إذا كان لدينا <span class=\"m\">p, q, r<\/span> <span class=\"m\">⇒ 2<sup>3<\/sup> = 8<\/span> صفوف.<\/li>\n<li>إذا كان لدينا <span class=\"m\">p, q, r, s<\/span> <span class=\"m\">⇒ 2<sup>4<\/sup> = 16<\/span> صفاً.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>فخ امتحاني:<\/strong> في سؤال مثل: &quot;كم عدد صفوف جدول الصواب للعبارة <span class=\"m\">(p → r) ∨ (¬ s → ¬ t) ∨ (¬ u → v)<\/span>؟&quot;<br />\nلا تعد الروابط أو إشارات النفي؛ عد فقط الحروف الفريدة: <span class=\"m\">p, r, s, t, u, v<\/span> (عددها 6 متغيرات). إذن عدد الصفوف هو <span class=\"m\">2<sup>6<\/sup> = 64<\/span> صفاً.<\/p>\n<\/blockquote>\n"}, {"s": "Conditional", "t": "الجملة الشرطية (Conditional Statement / Implication: <span class=\"m\">p → q<\/span>)", "h": "<h3>3.1 التعريف الرياضي وأسماء الأطراف<\/h3>\n<ul>\n<li><strong>الرمز والقراءة:<\/strong> <span class=\"m\">p → q<\/span>، وتُقرأ &quot;if <span class=\"m\">p<\/span>, then <span class=\"m\">q<\/span>&quot; أو &quot;<span class=\"m\">p<\/span> implies <span class=\"m\">q<\/span>&quot;.<\/li>\n<li><strong>الطرف الأول (<span class=\"m\">p<\/span>):<\/strong> يُسمى الفرضية (Hypothesis) أو المقدمة (Premise / Antecedent).<\/li>\n<li><strong>الطرف الثاني (<span class=\"m\">q<\/span>):<\/strong> يُسمى النتيجة (Conclusion) أو التالي (Consequence).<\/li>\n<\/ul>\n<h3>3.2 جدول الصواب وفلسفة العقد والالتزام (Obligation / Contract)<\/h3>\n<ul>\n<li><strong>القاعدة الصارمة:<\/strong> العبارة الشرطية <span class=\"m\">p → q<\/span> تكون خاطئة (<span class=\"m\">F<\/span>) في <strong>حالة وحيدة فقط<\/strong>:\n<div class=\"m dm\">When p = T and q = F<\/div>\nوفي جميع الحالات الأخرى تكون دائماً صائبة (<span class=\"m\">T<\/span>).<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p → q<\/span><\/th>\n  <th style=\"text-align:left\">التفسير بحسب منطق الالتزام (Contract Interpretation)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:left\">وفى بالشرط وحصلت النتيجة (العقد سليم ومحقق).<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:left\">وفى بالشرط لكن النتيجة لم تحدث (كسر العقد ونقض الوعد).<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:left\">الشرط لم يتحقق أصلاً، وحدثت النتيجة بسبب آخر (لم ينقض العقد).<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:left\">الشرط لم يتحقق والنتيجة لم تحدث (لم ينقض العقد).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>تشبيه السلايدات:<\/strong>\nتعهد مرشح سياسي: &quot;If I am elected, then I will lower taxes.&quot;<ul>\n<li>إذا انتُخب وخفّض الضرائب <span class=\"m\">⇒ T<\/span>.<\/li>\n<li>إذا انتُخب ولم يُخفّض الضرائب <span class=\"m\">⇒ F<\/span> (كذب على الناخبين).<\/li>\n<li>إذا لم يُنتخب أصلاً، سواء انخفضت الضرائب أم لا <span class=\"m\">⇒ T<\/span>، لأنه لم ينقض وعده!<\/li>\n<\/ul>\n<\/li>\n<li><strong>مفهوم الصواب الفارغ (Vacuous Truth):<\/strong>\nفي المنطق الرياضي، لا يُشترط وجود أي رابط سببي أو منطقي بين <span class=\"m\">p<\/span> و <span class=\"m\">q<\/span>. قيمة <span class=\"m\">p → q<\/span> تعتمد فقط على قيمتي الصواب.<ul>\n<li>مثال السلايدات: <code>&quot;If the clouds are made of cotton candy, then I have more money than Bill Gates.&quot;<\/code><br />\nهذه العبارة صائبة (<span class=\"m\">T<\/span>) رياضياً لأن الفرضية مستحيلة وخاطئة (<span class=\"m\">F<\/span>).<\/li>\n<li>مثال السلايدات: <code>&quot;If UQU is opened every Friday then 2 is a prime.&quot;<\/code><br />\nبما أن جامعة أم القرى لا تفتح أيام الجمع (<span class=\"m\">p = F<\/span>)، فالعبارة كاملة صائبة (<span class=\"m\">T<\/span>) مباشرة.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>3.3 الصيغ اللفظية الـ 13 للتعبير عن <span class=\"m\">p → q<\/span> في اللغة الإنجليزية<\/h3>\n<p>هذه القائمة هي المصدر الأول لأسئلة الاختبارات؛ حيث يطلب السؤال تحويل جملة إنجليزية إلى صيغة رمزية. انتبه لموقع الفرضية وموقع النتيجة:<\/p>\n<h4>أ) صيغ تحافظ على الترتيب (الفرضية <span class=\"m\">p<\/span> تأتي أولاً <span class=\"m\">→<\/span> النتيجة <span class=\"m\">q<\/span>):<\/h4>\n<ol>\n<li><code>if p, then q<\/code><\/li>\n<li><code>if p, q<\/code><\/li>\n<li><code>p implies q<\/code><\/li>\n<li><code>p only if q<\/code>  <em>(انتبه جداً لكلمة only if: ما يتبعها هو النتيجة)<\/em><\/li>\n<li><code>p is sufficient for q<\/code> (<span class=\"m\">p<\/span> شرط كافٍ لحدوث <span class=\"m\">q<\/span>)<\/li>\n<li><code>a sufficient condition for q is p<\/code><\/li>\n<\/ol>\n<h4>ب) صيغ تعكس الترتيب اللفظي (النتيجة <span class=\"m\">q<\/span> تأتي لفظياً قبل الفرضية <span class=\"m\">p<\/span>، لكن الرمز يظل <span class=\"m\">p → q<\/span>):<\/h4>\n<ol start=\"7\">\n<li><code>q if p<\/code>  <em>(انتبه: ما يتبع if دائماً هو الفرضية)<\/em><\/li>\n<li><code>q whenever p<\/code><\/li>\n<li><code>q when p<\/code><\/li>\n<li><code>q follows from p<\/code><\/li>\n<li><code>q is necessary for p<\/code> (<span class=\"m\">q<\/span> شرط لازم لحدوث <span class=\"m\">p<\/span>)<\/li>\n<li><code>a necessary condition for p is q<\/code><\/li>\n<li><code>q unless ¬p<\/code> (تكافئ <span class=\"m\">p → q<\/span> لأن <span class=\"m\">q<\/span> unless <span class=\"m\">¬ p<\/span> تعني <span class=\"m\">¬(¬ p) → q<\/span>)<\/li>\n<\/ol>\n<blockquote>\n<p>⚠ <strong>تصحيح:<\/strong> <code>p is necessary for q<\/code> تعني <span class=\"m\">q → p<\/span> (عكس ما قد تظن)، لذلك ليست من الصيغ الـ 13 لـ <span class=\"m\">p → q<\/span>. القاعدة: <strong>necessary → النتيجة (q)<\/strong>، و <strong>sufficient → الفرضية (p)<\/strong>.<\/p>\n<\/blockquote>\n<h3>3.4 المشتقات الشرطية (Converse, Contrapositive, Inverse)<\/h3>\n<p>من أي جملة شرطية أساسية <span class=\"m\">p → q<\/span>، نستطيع اشتقاق ثلاث جمل شرطية فرعية:<\/p>\n<ol>\n<li><strong>العكس (Converse):<\/strong> نقلب الاتجاه ونبدل الأماكن <span class=\"m\">⇒ q → p<\/span>.<\/li>\n<li><strong>المعاكس الإيجابي (Contrapositive):<\/strong> نبدل الأماكن وننفي الطرفين معاً <span class=\"m\">⇒ ¬ q → ¬ p<\/span>.<\/li>\n<li><strong>المعكوس (Inverse):<\/strong> ننفي طرفي العبارة الأصلية دون تبديل الأماكن <span class=\"m\">⇒ ¬ p → ¬ q<\/span>.<\/li>\n<\/ol>\n<h4>جدول مقارنة قيم الصواب للمشتقات الشرطية:<\/h4>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\">Implication: <span class=\"m\">p → q<\/span><\/th>\n  <th style=\"text-align:center\">Converse: <span class=\"m\">q → p<\/span><\/th>\n  <th style=\"text-align:center\">Inverse: <span class=\"m\">¬ p → ¬ q<\/span><\/th>\n  <th style=\"text-align:center\">Contrapositive: <span class=\"m\">¬ q → ¬ p<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>الاستنتاجات الجوهرية (حفظ وتطبيق):<\/h4>\n<ul>\n<li><strong>العبارة الشرطية تكافئ دائماً المعاكس الإيجابي:<\/strong>\n<div class=\"m dm\">p → q ≡ ¬ q → ¬ p<\/div><\/li>\n<li><strong>العكس يكافئ دائماً المعكوس:<\/strong>\n<div class=\"m dm\">q → p ≡ ¬ p → ¬ q<\/div><\/li>\n<li><strong>العبارة الشرطية لا تكافئ العكس ولا تكافئ المعكوس:<\/strong>\n<div class=\"m dm\">p → q ≢ q → p, p → q ≢ ¬ p → ¬ q<\/div><\/li>\n<\/ul>\n<h4>مثال السلايدات المحلول بالتفصيل:<\/h4>\n<ul>\n<li>الجملة: <code>&quot;It is raining is a sufficient condition for me not going to town.&quot;<\/code><ul>\n<li>المتغيرات:<ul>\n<li><span class=\"m\">p<\/span>: It is raining.<\/li>\n<li><span class=\"m\">q<\/span>: I am going to town.<\/li>\n<li>العبارة الأصلية: <span class=\"m\">p → ¬ q<\/span>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Converse (<span class=\"m\">q → p<\/span> على المتغيرات المعطاة):<\/strong><ul>\n<li>الرمز: <span class=\"m\">¬ q → p<\/span>.<\/li>\n<li>لفظياً: <code>&quot;If I am not going to town, then it is raining.&quot;<\/code><br />\n(أو: &quot;I am not going to town is a sufficient condition for it is raining&quot;).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Inverse (<span class=\"m\">¬ p → ¬ q<\/span> على المتغيرات المعطاة):<\/strong><ul>\n<li>الرمز: <span class=\"m\">¬ p → ¬(¬ q) ≡ ¬ p → q<\/span>.<\/li>\n<li>لفظياً: <code>&quot;If it is not raining, then I am going to town.&quot;<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Contrapositive (نفي وتبديل):<\/strong><ul>\n<li>الرمز: <span class=\"m\">¬(¬ q) → ¬ p ≡ q → ¬ p<\/span>.<\/li>\n<li>لفظياً: <code>&quot;If I am going to town, then it is not raining.&quot;<\/code><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"s": "Biconditional", "t": "الشرط الثنائي (Biconditional Statement: <span class=\"m\">p ↔ q<\/span>)", "h": "<h3>4.1 التعريف وجدول الصواب<\/h3>\n<ul>\n<li><strong>الرمز والقراءة:<\/strong> <span class=\"m\">p ↔ q<\/span>، وتُقرأ &quot;<span class=\"m\">p<\/span> if and only if <span class=\"m\">q<\/span>&quot; (وتُختصر بـ &quot;<span class=\"m\">p<\/span> iff <span class=\"m\">q<\/span>&quot;).<\/li>\n<li><strong>التركيب المنطقي:<\/strong> الشرط الثنائي هو عبارة وصل تربط العبارة الشرطية بعكسها:\n<div class=\"m dm\">p ↔ q ≡ (p → q) ∧ (q → p)<\/div><\/li>\n<li><strong>القاعدة الذهبية:<\/strong> تكون العبارة صائبة (<span class=\"m\">T<\/span>) إذا <strong>تشابهت<\/strong> قيمتا الصواب للطرفين (كلاهما <span class=\"m\">T<\/span> أو كلاهما <span class=\"m\">F<\/span>). وتكون خاطئة (<span class=\"m\">F<\/span>) إذا <strong>اختلفت<\/strong> قيمهما.<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ↔ q<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>4.2 الصيغ اللفظية للتعبير عن <span class=\"m\">p ↔ q<\/span> باللغة الإنجليزية<\/h3>\n<ol>\n<li><code>p if and only if q<\/code><\/li>\n<li><code>p iff q<\/code><\/li>\n<li><code>p is necessary and sufficient for q<\/code> (<span class=\"m\">p<\/span> شرط لازم وكافٍ لـ <span class=\"m\">q<\/span>)<\/li>\n<li><code>if p then q, and conversely<\/code><\/li>\n<\/ol>\n"}, {"s": "Precedence", "t": "أولويات العمليات وبناء جداول الصواب المركبة (Operator Precedence & Truth Tables)", "h": "<h3>5.1 سلم الأولويات المنطقية (Operator Precedence)<\/h3>\n<p>عند غياب الأقواس، نطبق العمليات المنطقية وفق الترتيب الإلزامي التالي (من الأعلى أولوية إلى الأقل):<\/p>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\">الترتيب<\/th>\n  <th style=\"text-align:center\">المعامل المنطقي<\/th>\n  <th style=\"text-align:center\">الاسم<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\"><strong>1<\/strong><\/td>\n  <td style=\"text-align:center\"><span class=\"m\">¬<\/span><\/td>\n  <td style=\"text-align:center\">Negation (النفي)<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\"><strong>2<\/strong><\/td>\n  <td style=\"text-align:center\"><span class=\"m\">∧<\/span><\/td>\n  <td style=\"text-align:center\">Conjunction (الوصل)<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\"><strong>3<\/strong><\/td>\n  <td style=\"text-align:center\"><span class=\"m\">∨<\/span><\/td>\n  <td style=\"text-align:center\">Disjunction (الفصل)<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\"><strong>4<\/strong><\/td>\n  <td style=\"text-align:center\"><span class=\"m\">→<\/span><\/td>\n  <td style=\"text-align:center\">Conditional (الشرط)<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\"><strong>5<\/strong><\/td>\n  <td style=\"text-align:center\"><span class=\"m\">↔<\/span><\/td>\n  <td style=\"text-align:center\">Biconditional (الشرط الثنائي)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>ملاحظة من السلايدات:<\/strong>\nالعبارة <span class=\"m\">p ∨ q → ¬ r<\/span> تعني تلقائياً:\n<div class=\"m dm\">(p ∨ q) → (¬ r)<\/div>\nلأن <span class=\"m\">∨<\/span> و <span class=\"m\">¬<\/span> يسبقان السهم <span class=\"m\">→<\/span>. وإذا أردنا تقديم السهم وجب وضع أقواس صريحة: <span class=\"m\">p ∨ (q → ¬ r)<\/span>.<\/li>\n<\/ul>\n<h3>5.2 مثال تطبيقي محلول من السلايدات (بناء جدول صواب كامل)<\/h3>\n<p><strong>المطلوب:<\/strong> بناء جدول الصواب للعبارة: <span class=\"m\">(p ∨ q) → ¬ r<\/span><\/p>\n<ul>\n<li>عدد المتغيرات: 3 (<span class=\"m\">p, q, r<\/span>) <span class=\"m\">⇒<\/span> عدد الصفوف = <span class=\"m\">2<sup>3<\/sup> = 8<\/span> صفوف.<\/li>\n<li>خطوات الأعمدة:<ol>\n<li><span class=\"m\">p<\/span>: 4 مرات <span class=\"m\">T<\/span> ثم 4 مرات <span class=\"m\">F<\/span>.<\/li>\n<li><span class=\"m\">q<\/span>: مرتان <span class=\"m\">T<\/span> ثم مرتان <span class=\"m\">F<\/span> بالتبادل.<\/li>\n<li><span class=\"m\">r<\/span>: مرة <span class=\"m\">T<\/span> ومرة <span class=\"m\">F<\/span> بالتبادل.<\/li>\n<li><span class=\"m\">¬ r<\/span>: نفي عمود <span class=\"m\">r<\/span>.<\/li>\n<li><span class=\"m\">p ∨ q<\/span>: فصل عمودي <span class=\"m\">p<\/span> و <span class=\"m\">q<\/span>.<\/li>\n<li><span class=\"m\">(p ∨ q) → ¬ r<\/span>: تطبيق قاعدة السهم بين العمودين (5) و (4)؛ تكون <span class=\"m\">F<\/span> فقط إذا كان العمود (5) هو <span class=\"m\">T<\/span> والعمود (4) هو <span class=\"m\">F<\/span>.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">r<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ r<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p ∨ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">(p ∨ q) → ¬ r<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"s": "Classification", "t": "تصنيف العبارات المركبة (Classification of Compound Propositions)", "h": "<p>تُصنف العبارات المنطقية المركبة بحسب ناتج عمودها الأخير في جدول الصواب إلى ثلاثة أنواع:<\/p>\n<ol>\n<li><strong>تحصيل حاصل (Tautology):<\/strong><ul>\n<li>هي العبارة التي تكون <strong>صائبة دائماً (<span class=\"m\">T<\/span>)<\/strong> تحت جميع توزيعات قيم الصواب الممكنة.<\/li>\n<li><em>أشهر مثال:<\/em> <span class=\"m\">p ∨ ¬ p<\/span> (الشيء أو نفيه صائب دائماً).<\/li>\n<\/ul>\n<\/li>\n<li><strong>تناقض (Contradiction):<\/strong><ul>\n<li>هي العبارة التي تكون <strong>خاطئة دائماً (<span class=\"m\">F<\/span>)<\/strong> تحت جميع توزيعات قيم الصواب الممكنة.<\/li>\n<li><em>أشهر مثال:<\/em> <span class=\"m\">p ∧ ¬ p<\/span> (الشيء ونفيه مستحيل أن يجتمعا).<\/li>\n<\/ul>\n<\/li>\n<li><strong>احتمالية / مشروطة (Contingency):<\/strong><ul>\n<li>هي العبارة التي تكون نتائجها مختلطة (ليست Tautology وليست Contradiction؛ تحوي بعض قيم <span class=\"m\">T<\/span> وبعض قيم <span class=\"m\">F<\/span>).<\/li>\n<li><em>مثال:<\/em> <span class=\"m\">p ∨ q<\/span> أو المتغير <span class=\"m\">p<\/span> بمفرده.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p<\/span><\/th>\n  <th style=\"text-align:center\">Tautology: <span class=\"m\">p ∨ ¬ p<\/span><\/th>\n  <th style=\"text-align:center\">Contradiction: <span class=\"m\">p ∧ ¬ p<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"s": "Equivalences", "t": "التكافؤ المنطقي وقوانينه والبراهين الجبرية (Logical Equivalences & Proofs)", "h": "<h3>7.1 تعريف التكافؤ المنطقي (Logical Equivalence)<\/h3>\n<p>تكون العبارتان المركبتان <span class=\"m\">A<\/span> و <span class=\"m\">B<\/span> متكافئتين منطقياً (ونكتب <span class=\"m\">A ≡ B<\/span> أو <span class=\"m\">A ⇔ B<\/span>) إذا وفقط إذا كان:\n<div class=\"m dm\">A ↔ B is a Tautology<\/div>\nوبصيغة عملية في الجداول: تتطابق قيم الصواب في العمود الأخير للعبارة <span class=\"m\">A<\/span> تماماً مع قيم الصواب في العمود الأخير للعبارة <span class=\"m\">B<\/span> سطراً بسطر.<\/p>\n<h3>7.2 إثباتات التكافؤ باستخدام جداول الصواب (Truth Tables)<\/h3>\n<h4>أ) إثبات تكافؤ الجملة الشرطية ومعاكسها الإيجابي (<span class=\"m\">p → q ≡ ¬ q → ¬ p<\/span>):<\/h4>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p → q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ q → ¬ p<\/span><\/th>\n  <th style=\"text-align:center\">النتيجة<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\">متطابق<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\">متطابق<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\">متطابق<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\">متطابق<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>العمودان الأخيران متطابقان في كل الصفوف <span class=\"m\">⇒ p → q ≡ ¬ q → ¬ p<\/span>.<\/p>\n<h4>ب) إثبات أن الشرط يكافئ <span class=\"m\">¬ p ∨ q<\/span> (<span class=\"m\">p → q ≡ ¬ p ∨ q<\/span>):<\/h4>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:center\"><span class=\"m\">p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">¬ p ∨ q<\/span><\/th>\n  <th style=\"text-align:center\"><span class=\"m\">p → q<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>F<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">F<\/td>\n  <td style=\"text-align:center\">T<\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n  <td style=\"text-align:center\"><strong>T<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>العمودان متطابقان <span class=\"m\">⇒ p → q ≡ ¬ p ∨ q<\/span>.<\/p>\n<h3>7.3 الجداول المرجعية للقوانين المنطقية الأساسية (Key Logical Equivalences)<\/h3>\n<h4>1. القوانين المنطقية العامة:<\/h4>\n<div class=\"tscroll\"><table class=\"t\">\n<thead>\n<tr>\n  <th style=\"text-align:left\">اسم القانون (Law Name)<\/th>\n  <th style=\"text-align:left\">صيغة الوصل (<span class=\"m\">∧<\/span>)<\/th>\n  <th style=\"text-align:left\">صيغة الفصل (<span class=\"m\">∨<\/span>)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين المحايد (Identity Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ T ≡ p<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ F ≡ p<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين السيطرة (Domination Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ F ≡ F<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ T ≡ T<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين القوة الذاتية (Idempotent Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ p ≡ p<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ p ≡ p<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قانون النفي المزدوج (Double Negation)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">¬(¬ p) ≡ p<\/span><\/td>\n  <td style=\"text-align:left\">—<\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين النفي (Negation Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ ¬ p ≡ F<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ ¬ p ≡ T<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين الإبدال (Commutative Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ q ≡ q ∧ p<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ q ≡ q ∨ p<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين التجميع (Associative Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">(p ∧ q) ∧ r ≡ p ∧ (q ∧ r)<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">(p ∨ q) ∨ r ≡ p ∨ (q ∨ r)<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين التوزيع (Distributive Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r)<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r)<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين دي مورغان (De Morgan’s Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">¬(p ∧ q) ≡ ¬ p ∨ ¬ q<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">¬(p ∨ q) ≡ ¬ p ∧ ¬ q<\/span><\/td>\n<\/tr>\n<tr>\n  <td style=\"text-align:left\"><strong>قوانين الامتصاص (Absorption Laws)<\/strong><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∧ (p ∨ q) ≡ p<\/span><\/td>\n  <td style=\"text-align:left\"><span class=\"m\">p ∨ (p ∧ q) ≡ p<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>توضيح دقيق لقانون الامتصاص (Absorption Law):<\/strong><br />\nإذا ظهر المتغير <span class=\"m\">p<\/span> خارج القوس وداخله مع اختلاف الروابط بين <span class=\"m\">∧<\/span> و <span class=\"m\">∨<\/span>، فإن الناتج ينهار مباشرة إلى المتغير نفسه <span class=\"m\">p<\/span>، لأن قيمة <span class=\"m\">q<\/span> لا تؤثر أبداً على النتيجة.<\/p>\n<\/blockquote>\n<h4>2. قوانين الجمل الشرطية (Table 7 in Rosen / Slides):<\/h4>\n<ol>\n<li><span class=\"m\">p → q ≡ ¬ p ∨ q<\/span><\/li>\n<li><span class=\"m\">p → q ≡ ¬ q → ¬ p<\/span>  <em>(المعاكس الإيجابي)<\/em><\/li>\n<li><span class=\"m\">p ∨ q ≡ ¬ p → q<\/span><\/li>\n<li><span class=\"m\">p ∧ q ≡ ¬(p → ¬ q)<\/span><\/li>\n<li><span class=\"m\">¬(p → q) ≡ p ∧ ¬ q<\/span>  <em>(نفي الجملة الشرطية)<\/em><\/li>\n<li><span class=\"m\">(p → q) ∧ (p → r) ≡ p → (q ∧ r)<\/span><\/li>\n<li><span class=\"m\">(p → r) ∧ (q → r) ≡ (p ∨ q) → r<\/span><\/li>\n<li><span class=\"m\">(p → q) ∨ (p → r) ≡ p → (q ∨ r)<\/span><\/li>\n<li><span class=\"m\">(p → r) ∨ (q → r) ≡ (p ∧ q) → r<\/span><\/li>\n<\/ol>\n<h4>3. قوانين الشرط الثنائي (Table 8 in Rosen / Slides):<\/h4>\n<ol>\n<li><span class=\"m\">p ↔ q ≡ (p → q) ∧ (q → p)<\/span><\/li>\n<li><span class=\"m\">p ↔ q ≡ ¬ p ↔ ¬ q<\/span><\/li>\n<li><span class=\"m\">p ↔ q ≡ (p ∧ q) ∨ (¬ p ∧ ¬ q)<\/span><\/li>\n<li><span class=\"m\">¬(p ↔ q) ≡ p ↔ ¬ q<\/span><\/li>\n<\/ol>\n<h3>7.4 البراهين الجبرية المتسلسلة (Equivalence Proofs without Truth Tables)<\/h3>\n<p>في الاختبار، عندما يحدد السؤال: <em>&quot;Show that ... without using truth tables&quot;<\/em>، يُحظر استخدام الجداول ويجب كتابة متسلسلة خطوات جبرية مع ذكر اسم القانون المستند إليه في كل خطوة.<\/p>\n<h4>مثال 1 (محلول من السلايدات):<\/h4>\n<p><strong>أثبت أن:<\/strong> <span class=\"m\">¬(p ∨ (¬ p ∧ q)) ≡ ¬ p ∧ ¬ q<\/span><\/p>\n<p><strong>خطوات الحل خطوة بخطوة مع التبرير:<\/strong>\n<table class=\"proof\"><tr><td class=\"m\">¬(p ∨ (¬ p ∧ q)) ≡ ¬ p ∧ ¬(¬ p ∧ q)<\/td><td class=\"why\">by Second De Morgan's Law<\/td><\/tr><tr><td class=\"m\">≡ ¬ p ∧ [¬(¬ p) ∨ ¬ q]<\/td><td class=\"why\">by First De Morgan's Law<\/td><\/tr><tr><td class=\"m\">≡ ¬ p ∧ (p ∨ ¬ q)<\/td><td class=\"why\">by Double Negation Law (¬(¬ p) ≡ p)<\/td><\/tr><tr><td class=\"m\">≡ (¬ p ∧ p) ∨ (¬ p ∧ ¬ q)<\/td><td class=\"why\">by Distributive Law<\/td><\/tr><tr><td class=\"m\">≡ F ∨ (¬ p ∧ ¬ q)<\/td><td class=\"why\">by Negation Law (¬ p ∧ p ≡ F)<\/td><\/tr><tr><td class=\"m\">≡ (¬ p ∧ ¬ q) ∨ F<\/td><td class=\"why\">by Commutative Law for Disjunction<\/td><\/tr><tr><td class=\"m\">≡ ¬ p ∧ ¬ q<\/td><td class=\"why\">by Identity Law for F<\/td><\/tr><\/table><\/div>\nوهو المطلوب إثباته (<span class=\"m\">Q.E.D.<\/span>).<\/p>\n<h4>مثال 2 (محلول من السلايدات):<\/h4>\n<p><strong>أثبت أن العبارة التالية تمثل تحصيل حاصل (Tautology):<\/strong> <span class=\"m\">(p ∧ q) → (p ∨ q)<\/span><\/p>\n<p><strong>خطوات الحل الجبري:<\/strong>\n<table class=\"proof\"><tr><td class=\"m\">(p ∧ q) → (p ∨ q) ≡ ¬(p ∧ q) ∨ (p ∨ q)<\/td><td class=\"why\">by Conditional Equivalence (A → B ≡ ¬ A ∨ B)<\/td><\/tr><tr><td class=\"m\">≡ (¬ p ∨ ¬ q) ∨ (p ∨ q)<\/td><td class=\"why\">by First De Morgan's Law<\/td><\/tr><tr><td class=\"m\">≡ (¬ p ∨ p) ∨ (¬ q ∨ q)<\/td><td class=\"why\">by Associative and Commutative Laws<\/td><\/tr><tr><td class=\"m\">≡ T ∨ T<\/td><td class=\"why\">by Negation Laws (¬ p ∨ p ≡ T)<\/td><\/tr><tr><td class=\"m\">≡ T<\/td><td class=\"why\">by Domination / Idempotent Law<\/td><\/tr><\/table><\/div>\nبما أن النتيجة النهائية آلت إلى <span class=\"m\">T<\/span>، فالعبارة Tautology.<\/p>\n"}, {"s": "Satisfiability", "t": "قابلية التحقق المنطقي (Propositional Satisfiability - SAT)", "h": "<h3>8.1 التعريف الرياضي<\/h3>\n<ul>\n<li><strong>قابلة للتحقق (Satisfiable):<\/strong> تكون العبارة المركبة Satisfiable إذا وُجد تعيين واحد على الأقل لقيم صواب متغيراتها (Truth Assignment) يجعل العبارة ككل صائبة (<span class=\"m\">T<\/span>).<\/li>\n<li><strong>الحل (Solution):<\/strong> هو ذلك التعيين المحدد لقيم المتغيرات الذي يجعل العبارة <span class=\"m\">T<\/span>.<\/li>\n<li><strong>غير قابلة للتحقق (Unsatisfiable):<\/strong> تكون العبارة Unsatisfiable إذا كانت خاطئة (<span class=\"m\">F<\/span>) تحت <strong>جميع<\/strong> تعيينات قيم الصواب الممكنة (أي أن نفيها عبارة تحصيل حاصل Tautology، وهي بذاتها Contradiction).<\/li>\n<\/ul>\n<blockquote>\n<p><strong>ملاحظة منهجية مهمة:<\/strong><br />\nأي عبارة Tautology هي بالضرورة Satisfiable.<br />\nأي عبارة Contingency تحتوي على سطر واحد على الأقل قيمته <span class=\"m\">T<\/span> هي أيضاً Satisfiable.<br />\nالعبارة الوحيدة التي تكون Unsatisfiable هي الـ Contradiction.<\/p>\n<\/blockquote>\n<h3>8.2 أمثلة السلايدات المحلولة (Satisfiability Tests)<\/h3>\n<h4>المسألة الأولى:<\/h4>\n<p><div class=\"m dm\">Determine satisfiability of: (p ∨ ¬ q) ∧ (q ∨ ¬ r) ∧ (r ∨ ¬ p)<\/div><\/p>\n<ul>\n<li><strong>الهدف:<\/strong> نريد جعل كل قوس من الأقواس المربوطة بـ <span class=\"m\">∧<\/span> قيمته <span class=\"m\">T<\/span>.<\/li>\n<li><strong>التجربة والحل:<\/strong><ul>\n<li>لنفرض أن <span class=\"m\">p = T, q = T, r = T<\/span>:<ul>\n<li>القوس الأول: <span class=\"m\">(T ∨ ¬ T) = T ∨ F = T<\/span>.<\/li>\n<li>القوس الثاني: <span class=\"m\">(T ∨ ¬ T) = T ∨ F = T<\/span>.<\/li>\n<li>القوس الثالث: <span class=\"m\">(T ∨ ¬ T) = T ∨ F = T<\/span>.<\/li>\n<li>العبارة ككل: <span class=\"m\">T ∧ T ∧ T = T<\/span>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>الحكم:<\/strong> <strong>Satisfiable<\/strong>، والحل هو: <span class=\"m\">p = T, q = T, r = T<\/span> (حل آخر ممكن: <span class=\"m\">p = F, q = F, r = F<\/span>).<\/li>\n<\/ul>\n<h4>المسألة الثانية:<\/h4>\n<p><div class=\"m dm\">Determine satisfiability of: (p ∨ q ∨ r) ∧ (¬ p ∨ ¬ q ∨ ¬ r)<\/div><\/p>\n<ul>\n<li><strong>الهدف:<\/strong> نريد جعل القوس الأول <span class=\"m\">T<\/span> والقوس الثاني <span class=\"m\">T<\/span>.<ul>\n<li>القوس الأول يحتاج متغيراً واحداً على الأقل قيمته <span class=\"m\">T<\/span>.<\/li>\n<li>القوس الثاني يحتاج متغيراً واحداً على الأقل قيمته <span class=\"m\">F<\/span> (لأن نفي الـ <span class=\"m\">F<\/span> سيعطي <span class=\"m\">T<\/span>).<\/li>\n<\/ul>\n<\/li>\n<li><strong>التجربة والحل:<\/strong><ul>\n<li>نختار: <span class=\"m\">p = T, q = F, r = F<\/span>:<ul>\n<li>القوس الأول: <span class=\"m\">(T ∨ F ∨ F) = T<\/span>.<\/li>\n<li>القوس الثاني: <span class=\"m\">(¬ T ∨ ¬ F ∨ ¬ F) = (F ∨ T ∨ T) = T<\/span>.<\/li>\n<li>العبارة ككل: <span class=\"m\">T ∧ T = T<\/span>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li><strong>الحكم:<\/strong> <strong>Satisfiable<\/strong>، والحل هو: <span class=\"m\">p = T, q = F, r = F<\/span>.<\/li>\n<\/ul>\n<h4>المسألة الثالثة:<\/h4>\n<p><div class=\"m dm\">Determine satisfiability of: (p ∨ ¬ q) ∧ (q ∨ ¬ r) ∧ (r ∨ ¬ p) ∧ (p ∨ q ∨ r) ∧ (¬ p ∨ ¬ q ∨ ¬ r)<\/div><\/p>\n<ul>\n<li><strong>التحليل المنطقي:<\/strong><ul>\n<li>من الأقواس الثلاثة الأولى، لكي تكون صائبة معاً، يجب أن تتطابق قيم المتغيرات الثلاثة: إما جميعها <span class=\"m\">T<\/span> (<span class=\"m\">p=q=r=T<\/span>) أو جميعها <span class=\"m\">F<\/span> (<span class=\"m\">p=q=r=F<\/span>).<\/li>\n<li>إذا كانت جميعها <span class=\"m\">T<\/span>: القوس الأخير <span class=\"m\">(¬ p ∨ ¬ q ∨ ¬ r)<\/span> سيصبح <span class=\"m\">(F ∨ F ∨ F) = F<\/span>، فتسقط العبارة!<\/li>\n<li>إذا كانت جميعها <span class=\"m\">F<\/span>: القوس الرابع <span class=\"m\">(p ∨ q ∨ r)<\/span> سيصبح <span class=\"m\">(F ∨ F ∨ F) = F<\/span>، فتسقط العبارة!<\/li>\n<li>لا يوجد أي تعيين آخر ممكن من الاحتمالات الـ 8 (<span class=\"m\">2<sup>3<\/sup> = 8<\/span>) يجعل كل الأقواس <span class=\"m\">T<\/span> معاً.<\/li>\n<\/ul>\n<\/li>\n<li><strong>الحكم:<\/strong> <strong>Unsatisfiable (Not Satisfiable)<\/strong>.<\/li>\n<\/ul>\n"}, {"s": "Exercises", "t": "الحلول النموذجية لتمارين السلايدات وكتاب روزن (Exercise Sheet Solutions)", "h": "<p>هذه التمارين مستخرجة بالكامل من سلايدات التمارين المعتمدة (ملف <code>01_PropositionalLogic-Exercises.pptx<\/code>):<\/p>\n<h3>تمرين 2 (ص 13): حدد أي الجمل التالية Propositions مع بيان قيمة الصواب:<\/h3>\n<ol>\n<li><code>Do not pass go.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (صيغة أمر Command).<\/li>\n<li><code>What time is it?<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (سؤال Question).<\/li>\n<li><code>There are no black flies in Maine.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (تحتمل <span class=\"m\">T<\/span> أو <span class=\"m\">F<\/span>؛ وواقعياً في ماين هي <span class=\"m\">F<\/span>).<\/li>\n<li><code><span class=\"m\">4 + x = 5.<\/span><\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (تحتوي على متغير مجهول <span class=\"m\">x<\/span>).<\/li>\n<li><code>The moon is made of green cheese.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Proposition<\/strong> (وقيمتها <span class=\"m\">F<\/span>).<\/li>\n<li><code><span class=\"m\">2n ≥ 100.<\/span><\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Not a proposition<\/strong> (تحتوي على مجهول <span class=\"m\">n<\/span>).<\/li>\n<\/ol>\n<h3>تمارين 5-7 (ص 13): أوجد نفي كل من العبارات التالية:<\/h3>\n<ul>\n<li><strong>5b)<\/strong> <code>There is no pollution in New Jersey.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Negation:<\/strong> &quot;There is pollution in New Jersey.&quot; أو &quot;It is not the case that there is no pollution in New Jersey.&quot;<\/li>\n<li><strong>6a)<\/strong> <code>Jennifer and Teja are friends.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Negation:<\/strong> &quot;Jennifer and Teja are not friends.&quot;<\/li>\n<li><strong>6b)<\/strong> <code>There are 13 items in a baker’s dozen.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Negation:<\/strong> &quot;There are not 13 items in a baker’s dozen.&quot;<\/li>\n<li><strong>6c)<\/strong> <code>Abby sent more than 100 text messages yesterday.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Negation:<\/strong> &quot;Abby sent at most 100 text messages yesterday&quot; أو &quot;Abby did not send more than 100 text messages yesterday.&quot;<\/li>\n<li><strong>7c)<\/strong> <code><span class=\"m\">7 · 11 · 13 = 999.<\/span><\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Negation:<\/strong> <code><span class=\"m\">7 · 11 · 13 ≠ 999.<\/span><\/code><\/li>\n<li><strong>7d)<\/strong> <code>Diane rode her bicycle 100 miles on Sunday.<\/code><br />\n<span class=\"m\">⇒<\/span> <strong>Negation:<\/strong> &quot;Diane did not ride her bicycle 100 miles on Sunday.&quot;<\/li>\n<\/ul>\n<h3>تمرين 14 (ص 16): صياغة جمل إنجليزية من الرموز المنطقية<\/h3>\n<p>المعطيات:<\/p>\n<ul>\n<li><span class=\"m\">p<\/span>: You have the flu.<\/li>\n<li><span class=\"m\">q<\/span>: You miss the final examination.<\/li>\n<li><span class=\"m\">r<\/span>: You pass the course.<\/li>\n<\/ul>\n<p>المطلوب صياغة العبارات التالية كجمل إنجليزية:<\/p>\n<ul>\n<li><strong>b) <span class=\"m\">¬ q ↔ r<\/span>:<\/strong><br />\n&quot;You do not miss the final examination if and only if you pass the course.&quot;<\/li>\n<li><strong>c) <span class=\"m\">q → ¬ r<\/span>:<\/strong><br />\n&quot;If you miss the final examination, then you do not pass the course.&quot;<\/li>\n<li><strong>e) <span class=\"m\">(p → ¬ r) ∨ (q → ¬ r)<\/span>:<\/strong><br />\n&quot;If you have the flu then you do not pass the course, or if you miss the final examination then you do not pass the course.&quot;<\/li>\n<\/ul>\n<h3>تمرين 16 (ص 14): التعبير بالرموز المنطقية (Propositional Algebra)<\/h3>\n<p>المعطيات:<\/p>\n<ul>\n<li><span class=\"m\">p<\/span>: You get an A on the final exam.<\/li>\n<li><span class=\"m\">q<\/span>: You do every exercise in this book.<\/li>\n<li><span class=\"m\">r<\/span>: You get an A in this class.<\/li>\n<\/ul>\n<p>المطلوب:<\/p>\n<ul>\n<li><p><strong>a)<\/strong> &quot;You get an A in this class, but you do not do every exercise in this book.&quot;<br />\n<em>التحليل:<\/em> الكلمة <code>but<\/code> في المنطق تترجم دائماً إلى وصل (<span class=\"m\">∧<\/span>).<br />\n<span class=\"m\">⇒ r ∧ ¬ q<\/span><\/p>\n<\/li>\n<li><p><strong>c)<\/strong> &quot;To get an A in this class, it is necessary for you to get an A on the final.&quot;<br />\n<em>التحليل:<\/em> العبارة الشرطية تنص على أن الشرط اللازم (Necessary) يكون في جهة النتيجة.<br />\n<span class=\"m\">⇒ r → p<\/span><\/p>\n<\/li>\n<li><p><strong>f)<\/strong> &quot;You will get an A in this class if and only if you either do every exercise in this book or you get an A on the final.&quot;<br />\n<em>التحليل:<\/em> <code>if and only if<\/code> تعني <span class=\"m\">↔<\/span>، و <code>either ... or ...<\/code> دون الجمع تعني الفصل الإقصائي (<span class=\"m\">⊕<\/span>).<br />\n<span class=\"m\">⇒ r ↔ (q ⊕ p)<\/span><\/p>\n<blockquote>\n<p>⚠ <strong>ملاحظة:<\/strong> <code>either … or<\/code> بدون عبارة &quot;but not both&quot; تُترجم ∨ في بعض المراجع. حل السلايدات هنا استخدم ⊕، فاتبع حل الدكتور في الاختبار.<\/p>\n<\/blockquote>\n<\/li>\n<\/ul>\n<h3>تمارين 18-20 (ص 14): حدد قيمة الصواب للعبارات التالية (<span class=\"m\">T<\/span> أو <span class=\"m\">F<\/span>):<\/h3>\n<ul>\n<li><strong>18a)<\/strong> <code><span class=\"m\">2 + 2 = 4 if and only if 1 + 1 = 2.<\/span><\/code><br />\n<em>التحليل:<\/em> الطرف الأيسر <span class=\"m\">T<\/span> والطرف الأيمن <span class=\"m\">T<\/span>. تشابها في الشرط الثنائي <span class=\"m\">⇒<\/span> <strong>True<\/strong>.<\/li>\n<li><strong>18d)<\/strong> <code><span class=\"m\">0 &gt; 1 if and only if 2 &gt; 1.<\/span><\/code><br />\n<em>التحليل:<\/em> الطرف الأيسر <span class=\"m\">F<\/span> والطرف الأيمن <span class=\"m\">T<\/span>. اختلفا في الشرط الثنائي <span class=\"m\">⇒<\/span> <strong>False<\/strong>.<\/li>\n<li><strong>19c)<\/strong> <code>If 1 + 1 = 3, then 2 + 2 = 5.<\/code><br />\n<em>التحليل:<\/em> الفرضية <span class=\"m\">1 + 1 = 3<\/span> هي <span class=\"m\">F<\/span>. أي جملة شرط
